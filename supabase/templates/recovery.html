<!-- Template de recuperación de contraseña. El link crea la sesión en /auth/confirm y lleva a /actualizar-clave. -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; color: #171717;">
  <h2 style="margin-bottom: 16px;">Restablecé tu contraseña</h2>
  <p>Recibimos un pedido para cambiar la contraseña de tu cuenta en Torneos.</p>
  <p style="margin: 24px 0;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/actualizar-clave"
       style="background: #171717; color: #ffffff; padding: 12px 20px; border-radius: 8px; text-decoration: none; display: inline-block;">
      Elegir una nueva contraseña
    </a>
  </p>
  <p style="font-size: 13px; color: #525252;">Si no lo pediste vos, ignorá este mensaje: tu contraseña no cambia.</p>
</div>
