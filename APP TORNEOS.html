function renderDashboard(content){
  if(state.tournaments.length===0){
    content.innerHTML =
      '<div class="page-head"><div><h1>Tus torneos</h1><p class="sub">Organizá inscripciones, cuadros, canchas y resultados desde un solo lugar.</p></div></div>' +
      '<div class="empty-state">' +
        '<div class="es-icon">'+icon('trophy')+'</div>' +
        '<h3>Todavía no armaste ningún torneo</h3>' +
        '<p>Creá tu primer torneo de pádel (u otro deporte) y dejá que el sistema arme el cuadro, la programación de canchas y las tablas de zonas.</p>' +
        '<div class="es-actions">' +
          '<button class="btn btn-primary" id="es-new">'+icon('plus')+' Crear torneo</button>' +
          '<button class="btn btn-secondary" id="es-demo">Cargar torneo de ejemplo</button>' +
        '</div>' +
      '</div>';
    content.querySelector('#es-new').addEventListener('click', openWizard);
    content.querySelector('#es-demo').addEventListener('click', loadDemoTournament);
    return;
  }

  const list = state.tournaments.slice().sort((a,b)=>b.createdAt-a.createdAt);
  content.innerHTML =
    '<div class="page-head"><div><h1>Tus torneos</h1><p class="sub">'+list.length+' torneo'+(list.length===1?'':'s')+' creado'+(list.length===1?'':'s')+'.</p></div>' +
      '<div class="head-actions"><button class="btn btn-primary" id="dash-new">'+icon('plus')+' Nuevo torneo</button></div>' +
    '</div>' +
    '<div class="grid-cards">' +
      list.map(t=>{
        const st = tournamentComputedStatus(t);
        const teamsCount = t.categories.reduce((s,c)=>s+c.teams.length,0);
        return '<div class="card card-hover tourn-card" data-open="'+t.id+'">' +
          '<div class="thead"><h3>'+escapeHtml(t.name)+'</h3><span class="badge badge-'+st.tone+'"><span class="badge-dot"></span>'+st.label+'</span></div>' +
          '<div class="meta-row">' +
            '<span>'+icon('calendar')+' '+fmtDate(t.date)+'</span>' +
            (t.venue? '<span>'+icon('map')+' '+escapeHtml(t.venue)+'</span>' : '') +
            '<span>'+icon('court')+' '+t.courts.length+' cancha'+(t.courts.length===1?'':'s')+'</span>' +
            '<span>'+icon('clock')+' '+(t.timeSlots?t.timeSlots.length:0)+' franjas horarias</span>' +
          '</div>' +
          '<div class="foot">' +
            '<span class="badge badge-neutral">'+t.categories.length+' categoría'+(t.categories.length===1?'':'s')+'</span>' +
            '<span class="badge badge-neutral">'+icon('users')+' '+teamsCount+' parejas/equipos</span>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';
  content.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> openTournament(el.getAttribute('data-open')));
  });
  content.querySelector('#dash-new').addEventListener('click', openWizard);
}

function loadDemoTournament(){
  const d1 = todayIso();
  const [y, m, d] = d1.split('-').map(Number);
  const nextDt = new Date(y, m - 1, d + 1);
  const d2 = nextDt.getFullYear()+'-'+String(nextDt.getMonth()+1).padStart(2,'0')+'-'+String(nextDt.getDate()).padStart(2,'0');

  const slot1 = { id: uid('slot'), date: d1, startTime: '09:00', endTime: '12:00', label: formatSlotLabel(d1, '09:00', '12:00') };
  const slot2 = { id: uid('slot'), date: d1, startTime: '15:00', endTime: '18:00', label: formatSlotLabel(d1, '15:00', '18:00') };
  const slot3 = { id: uid('slot'), date: d2, startTime: '09:00', endTime: '15:00', label: formatSlotLabel(d2, '09:00', '15:00') };
  const slot4 = { id: uid('slot'), date: d2, startTime: '16:00', endTime: '21:00', label: formatSlotLabel(d2, '16:00', '21:00') };

  const t = createTournament({
    name:'Apertura de Otoño 2026', venue:'Club Náutico Rosario', date: d1,
    courts:[{id:uid('c'),name:'Cancha 1'},{id:uid('c'),name:'Cancha 2'},{id:uid('c'),name:'Cancha 3'}],
    timeSlots: [slot1, slot2, slot3, slot4],
    startTime:'09:00', endTime:'21:00', matchDuration:75, restTime:45,
  });
  const cat = createCategory({ tournamentId:t.id, name:'4ta Caballeros', sport:'PADEL', format:'GROUPS_PLAYOFFS', maxTeams:8, entryFee:12000, qualifiersPerGroup:2, groupSize:4 });
  const names = [
    ['Martín Paz','Ezequiel Sosa'],
    ['Nicolás Ríos','Tomás Aguirre'],
    ['Franco Díaz','Ignacio Luna'],
    ['Rodrigo Vega','Agustín Toledo'],
    ['Leandro Ibáñez','Maximiliano Cano'],
    ['Julián Ferreyra','Bruno Aranda'],
    ['Emanuel Correa','Gastón Molina'],
    ['Federico Ojeda','Damián Rojas'],
  ];
  names.forEach((n,idx)=>{
    const assignedSlots = idx % 2 === 0 ? [slot1.id, slot2.id] : [slot2.id, slot3.id, slot4.id];
    cat.teams.push(createTeam({name:n[0] + ' / ' + n[1], player1:n[0], player2:n[1], seed: idx<2?idx+1:null, availableSlots: assignedSlots}));
  });
  t.categories.push(cat);
  state.tournaments.push(t);
  showToast('Torneo de ejemplo cargado', 'success');
  openTournament(t.id);
}

/* ---------------------------- NAVEGACIÓN ---------------------------- */
function openTournament(id){
  state.activeTournamentId = id;
  const t = getTournament(id);
  state.activeCategoryId = t && t.categories.length ? t.categories[0].id : null;
  state.view = 'tournament';
  state.tournamentTab = 'equipos';
  render();
  window.scrollTo(0,0);
}

/* ---------------------------- WIZARD: CREAR TORNEO ---------------------------- */
function openWizard(){
  const baseDate = todayIso();
  state.view = 'wizard';
  state.wizard = {
    step: 1,
    general: { name:'', description:'', venue:'', date: baseDate, courts:['Cancha 1','Cancha 2'] },
    categories: [],
    schedule: {
      startTime:'09:00', endTime:'21:00', matchDuration:90, restTime:45,
      timeSlots: [
        { id: uid('slot'), date: baseDate, startTime: '09:00', endTime: '12:00', label: formatSlotLabel(baseDate, '09:00', '12:00') },
        { id: uid('slot'), date: baseDate, startTime: '15:00', endTime: '18:00', label: formatSlotLabel(baseDate, '15:00', '18:00') }
      ]
    },
  };
  render();
  window.scrollTo(0,0);
}

const PRESET_SIZES = [4,8,16,32];

function renderWizard(content){
  const w = state.wizard;
  const steps = [
    {n:1, label:'Datos generales'},
    {n:2, label:'Categorías'},
    {n:3, label:'Horarios y Franjas'},
    {n:4, label:'Revisión'},
  ];
  content.innerHTML =
    '<div class="page-head"><div><h1>Nuevo torneo</h1><p class="sub">Configurá el torneo paso a paso. Podés ajustar todo después.</p></div></div>' +
    '<div class="wizard-steps">' +
      steps.map((s,i)=>
        '<div class="wizard-step '+(w.step===s.n?'is-active':'')+' '+(w.step>s.n?'is-done':'')+'">' +
          '<div class="num">'+(w.step>s.n? icon('check') : s.n)+'</div><div class="label">'+s.label+'</div>' +
        '</div>' + (i<steps.length-1? '<div class="wizard-step-sep"></div>' : '')
      ).join('') +
    '</div>' +
    '<div class="wizard-panel" id="wizard-panel"></div>';

  const panel = content.querySelector('#wizard-panel');
  if(w.step===1) renderWizardStep1(panel);
  if(w.step===2) renderWizardStep2(panel);
  if(w.step===3) renderWizardStep3(panel);
  if(w.step===4) renderWizardStep4(panel);
}

function wizardNav(panel, {backLabel, nextLabel, onBack, onNext, nextDisabled}){
  const wrap = document.createElement('div');
  wrap.className = 'wizard-actions';
  wrap.innerHTML =
    '<button class="btn btn-secondary" id="wiz-back">'+icon('chevronLeft')+' '+(backLabel||'Cancelar')+'</button>' +
    '<button class="btn btn-primary" id="wiz-next" '+(nextDisabled?'disabled':'')+'>'+(nextLabel||'Continuar')+' '+icon('chevronRight')+'</button>';
  panel.appendChild(wrap);
  panel.querySelector('#wiz-back').addEventListener('click', onBack);
  panel.querySelector('#wiz-next').addEventListener('click', onNext);
}

function renderWizardStep1(panel){
  const g = state.wizard.general;
  panel.innerHTML =
    '<div class="field"><label for="f-name">Nombre del torneo</label><input class="input" id="f-name" value="'+escapeHtml(g.name)+'" placeholder="Ej: Apertura de Otoño 2026"></div>' +
    '<div class="field"><label for="f-desc">Descripción <span class="hint">(opcional)</span></label><textarea class="input" id="f-desc" placeholder="Información visible para los participantes">'+escapeHtml(g.description)+'</textarea></div>' +
    '<div class="form-row">' +
      '<div class="field"><label for="f-venue">Sede / lugar</label><input class="input" id="f-venue" value="'+escapeHtml(g.venue)+'" placeholder="Ej: Club Náutico Rosario"></div>' +
      '<div class="field"><label for="f-date">Fecha de inicio</label><input class="input" type="date" id="f-date" value="'+g.date+'"></div>' +
    '</div>' +
    '<div class="field"><label>Canchas disponibles</label>' +
      '<div class="mini-list" id="courts-list"></div>' +
      '<button class="btn btn-outline btn-sm" id="add-court">'+icon('plus')+' Agregar cancha</button>' +
    '</div>';

  function renderCourts(){
    const list = panel.querySelector('#courts-list');
    list.innerHTML = g.courts.map((c,idx)=>
      '<div class="mini-list-item"><span class="name">'+icon('court')+' '+escapeHtml(c)+'</span>' +
      '<button class="icon-btn" data-rm-court="'+idx+'" aria-label="Quitar cancha" '+(g.courts.length<=1?'disabled':'')+'>'+icon('trash')+'</button></div>'
    ).join('');
    list.querySelectorAll('[data-rm-court]').forEach(b=> b.addEventListener('click', ()=>{
      g.courts.splice(Number(b.getAttribute('data-rm-court')),1); renderCourts();
    }));
  }
  renderCourts();
  panel.querySelector('#add-court').addEventListener('click', ()=>{
    g.courts.push('Cancha '+(g.courts.length+1));
    renderCourts();
  });

  wizardNav(panel, {
    backLabel:'Cancelar', nextLabel:'Continuar',
    onBack:()=>{ state.view='dashboard'; render(); },
    onNext:()=>{
      g.name = panel.querySelector('#f-name').value.trim();
      g.description = panel.querySelector('#f-desc').value.trim();
      g.venue = panel.querySelector('#f-venue').value.trim();
      g.date = panel.querySelector('#f-date').value || todayIso();
      if(!g.name){ showToast('Ingresá un nombre para el torneo', 'error'); return; }
      if(g.courts.length===0){ showToast('Agregá al menos una cancha', 'error'); return; }
      state.wizard.step = 2;
      render();
    }
  });
}

function renderWizardStep2(panel){
  const cats = state.wizard.categories;
  panel.innerHTML =
    '<p class="help-text">Agregá una o más categorías. Cada una tiene su propio formato, cupo y reglas de puntuación.</p>' +
    '<div class="mini-list" id="cat-list"></div>' +
    '<button class="btn btn-outline" id="add-cat">'+icon('plus')+' Agregar categoría</button>';

  function renderCats(){
    const list = panel.querySelector('#cat-list');
    if(cats.length===0){
      list.innerHTML = '<div class="empty-state" style="padding:32px 18px;"><p>Todavía no agregaste ninguna categoría.</p></div>';
      return;
    }
    list.innerHTML = cats.map((c,idx)=>
      '<div class="mini-list-item"><span class="name">'+escapeHtml(c.name)+' <span class="meta">· '+sportInfo(c.sport).label+' · '+formatInfo(c.format).label+' · hasta '+c.maxTeams+' equipos</span></span>' +
      '<button class="icon-btn" data-rm-cat="'+idx+'" aria-label="Quitar categoría">'+icon('trash')+'</button></div>'
    ).join('');
    list.querySelectorAll('[data-rm-cat]').forEach(b=> b.addEventListener('click', ()=>{
      cats.splice(Number(b.getAttribute('data-rm-cat')),1); renderCats();
    }));
  }
  renderCats();
  panel.querySelector('#add-cat').addEventListener('click', ()=> openCategoryFormModal(null, (data)=>{
    cats.push(data); renderCats();
  }));

  wizardNav(panel, {
    backLabel:'Atrás', nextLabel:'Continuar',
    onBack:()=>{ state.wizard.step=1; render(); },
    onNext:()=>{
      if(cats.length===0){ showToast('Agregá al menos una categoría para continuar', 'error'); return; }
      state.wizard.step = 3; render();
    }
  });
}

function renderWizardStep3(panel){
  const s = state.wizard.schedule;
  panel.innerHTML =
    '<div class="section-title">Franjas horarias con fecha y hora reales</div>' +
    '<p class="help-text">Creá las franjas horarias seleccionando el día en el calendario y las horas. En una misma fecha no se permite superposición ni solapamiento de horarios.</p>' +
    '<div class="mini-list" id="slots-list"></div>' +
    '<div style="background:var(--surface-2);padding:14px;border-radius:12px;border:1px solid var(--border);margin-bottom:20px;">' +
      '<div style="font-size:12.5px;font-weight:600;margin-bottom:8px;">Nueva franja horaria:</div>' +
      '<div class="form-row-3" style="align-items:flex-end;">' +
        '<div class="field" style="margin-bottom:0;"><label for="w-slot-date">Día (calendario)</label><input class="input" type="date" id="w-slot-date" value="'+(state.wizard.general.date||todayIso())+'"></div>' +
        '<div class="field" style="margin-bottom:0;"><label for="w-slot-start">Hora desde</label><input class="input" type="time" id="w-slot-start" value="09:00"></div>' +
        '<div class="field" style="margin-bottom:0;"><label for="w-slot-end">Hora hasta</label><input class="input" type="time" id="w-slot-end" value="12:00"></div>' +
      '</div>' +
      '<button class="btn btn-outline btn-sm" id="w-add-slot-btn" style="margin-top:12px;">'+icon('plus')+' Agregar franja</button>' +
    '</div>' +
    '<div class="divider"></div>' +
    '<div class="section-title">Parámetros generales de programación</div>' +
    '<div class="form-row">' +
      '<div class="field"><label for="s-start">Hora inicio diaria general</label><input class="input" type="time" id="s-start" value="'+s.startTime+'"></div>' +
      '<div class="field"><label for="s-end">Hora fin diaria general</label><input class="input" type="time" id="s-end" value="'+s.endTime+'"></div>' +
    '</div>' +
    '<div class="form-row">' +
      '<div class="field"><label for="s-dur">Duración estimada por partido (min)</label><input class="input" type="number" min="20" step="5" id="s-dur" value="'+s.matchDuration+'"></div>' +
      '<div class="field"><label for="s-rest">Descanso mínimo entre partidos (min)</label><input class="input" type="number" min="0" step="5" id="s-rest" value="'+s.restTime+'"></div>' +
    '</div>';

  function renderSlots(){
    const list = panel.querySelector('#slots-list');
    list.innerHTML = s.timeSlots.map((st,idx)=>
      '<div class="mini-list-item"><span class="name">'+icon('clock')+' '+escapeHtml(st.label)+'</span>' +
      '<button class="icon-btn" data-rm-slot="'+idx+'" aria-label="Quitar franja">'+icon('trash')+'</button></div>'
    ).join('');
    list.querySelectorAll('[data-rm-slot]').forEach(b=> b.addEventListener('click', ()=>{
      s.timeSlots.splice(Number(b.getAttribute('data-rm-slot')),1); renderSlots();
    }));
  }
  renderSlots();

  panel.querySelector('#w-add-slot-btn').addEventListener('click', ()=>{
    const date = panel.querySelector('#w-slot-date').value;
    const start = panel.querySelector('#w-slot-start').value;
    const end = panel.querySelector('#w-slot-end').value;

    if(!date){ showToast('Seleccioná una fecha válida en el calendario', 'error'); return; }
    if(!start || !end){ showToast('Ingresá hora de inicio y de fin', 'error'); return; }

    const check = checkSlotOverlap(date, start, end, s.timeSlots);
    if(check.error){
      showToast(check.error, 'error');
      return;
    }

    s.timeSlots.push({
      id: uid('slot'),
      date,
      startTime: start,
      endTime: end,
      label: formatSlotLabel(date, start, end)
    });
    sortTimeSlots(s.timeSlots);
    renderSlots();
  });

  wizardNav(panel, {
    backLabel:'Atrás', nextLabel:'Continuar',
    onBack:()=>{ state.wizard.step=2; render(); },
    onNext:()=>{
      s.startTime = panel.querySelector('#s-start').value || '09:00';
      s.endTime = panel.querySelector('#s-end').value || '21:00';
      s.matchDuration = Number(panel.querySelector('#s-dur').value)||90;
      s.restTime = Number(panel.querySelector('#s-rest').value)||45;
      if(s.timeSlots.length < 2){
        showToast('Cargá al menos 2 franjas horarias para permitir la elección de los participantes', 'error');
        return;
      }
      if(parseTimeToMinutes(s.endTime) <= parseTimeToMinutes(s.startTime)){
        showToast('La hora de finalización debe ser posterior al inicio', 'error'); return;
      }
      state.wizard.step = 4; render();
    }
  });
}

function renderWizardStep4(panel){
  const w = state.wizard;
  panel.innerHTML =
    '<div class="section-title">Resumen</div>' +
    '<div class="card" style="margin-bottom:16px;">' +
      '<div class="meta-row" style="gap:8px;">' +
        '<span>'+icon('trophy')+' <strong>'+escapeHtml(w.general.name)+'</strong></span>' +
        (w.general.venue?'<span>'+icon('map')+' '+escapeHtml(w.general.venue)+'</span>':'') +
        '<span>'+icon('calendar')+' '+fmtDate(w.general.date)+'</span>' +
        '<span>'+icon('court')+' '+w.general.courts.length+' cancha'+(w.general.courts.length===1?'':'s')+'</span>' +
        '<span>'+icon('clock')+' '+w.schedule.timeSlots.length+' franjas horarias configuradas</span>' +
      '</div>' +
    '</div>' +
    '<div class="section-title">Franjas horarias con fechas ('+w.schedule.timeSlots.length+')</div>' +
    '<div class="mini-list" style="margin-bottom:18px;">' +
      w.schedule.timeSlots.map(st=> '<div class="mini-list-item"><span class="name">'+icon('clock')+' '+escapeHtml(st.label)+'</span></div>').join('') +
    '</div>' +
    '<div class="section-title">Categorías ('+w.categories.length+')</div>' +
    '<div class="mini-list">' +
      w.categories.map(c=> '<div class="mini-list-item"><span class="name">'+escapeHtml(c.name)+'</span><span class="meta">'+sportInfo(c.sport).label+' · '+formatInfo(c.format).label+' · hasta '+c.maxTeams+' equipos · $'+c.entryFee+'</span></div>').join('') +
    '</div>';

  wizardNav(panel, {
    backLabel:'Atrás', nextLabel:'Crear torneo',
    onBack:()=>{ state.wizard.step=3; render(); },
    onNext:()=>{
      const t = createTournament({
        name:w.general.name, description:w.general.description, venue:w.general.venue, date:w.general.date,
        courts:w.general.courts.map(name=>({id:uid('c'), name})),
        timeSlots: w.schedule.timeSlots,
        startTime:w.schedule.startTime, endTime:w.schedule.endTime,
        matchDuration:w.schedule.matchDuration, restTime:w.schedule.restTime,
      });
      w.categories.forEach(cd=>{
        const cat = createCategory(Object.assign({tournamentId:t.id}, cd));
        t.categories.push(cat);
      });
      state.tournaments.push(t);
      state.wizard = null;
      showToast('Torneo creado exitosamente.', 'success');
      openTournament(t.id);
    }
  });
}

function openCategoryFormModal(existing, onSave){
  const isEdit = !!existing;
  const data = existing ? Object.assign({}, existing) : {
    name:'', sport:'PADEL', format:'GROUPS_PLAYOFFS', maxTeams:8, entryFee:0,
    qualifiersPerGroup:2, groupSize:4, setsToWin:2, superTiebreak:true,
  };
  openModal({
    title: isEdit? 'Editar categoría' : 'Nueva categoría',
    subtitle: 'Cada categoría tiene su propio cuadro y cupo, independiente del resto.',
    bodyHtml:
      '<div class="field"><label for="c-name">Nombre de la categoría</label><input class="input" id="c-name" value="'+escapeHtml(data.name)+'" placeholder="Ej: 4ta Caballeros"></div>' +
      '<div class="form-row">' +
        '<div class="field"><label for="c-sport">Deporte</label><select class="input" id="c-sport">'+
          SPORTS.map(s=>'<option value="'+s.key+'" '+(data.sport===s.key?'selected':'')+'>'+s.label+'</option>').join('')+
        '</select></div>' +
        '<div class="field"><label for="c-format">Formato</label><select class="input" id="c-format">'+
          FORMATS.map(f=>'<option value="'+f.key+'" '+(data.format===f.key?'selected':'')+'>'+f.label+'</option>').join('')+
        '</select></div>' +
      '</div>' +
      '<div class="field"><label>Tamaño del cuadro</label>' +
        '<div class="chip-row" id="preset-chips">' +
          PRESET_SIZES.map(n=>'<button type="button" class="chip" data-preset="'+n+'">'+n+' equipos</button>').join('') +
          '<button type="button" class="chip chip-add" data-preset="custom">Personalizado</button>' +
        '</div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="field"><label for="c-max">Cupo máximo de equipos</label><input class="input" type="number" min="2" id="c-max" value="'+data.maxTeams+'"></div>' +
        '<div class="field"><label for="c-fee">Costo de inscripción ($)</label><input class="input" type="number" min="0" step="500" id="c-fee" value="'+data.entryFee+'"></div>' +
      '</div>' +
      '<div id="format-extra"></div>' +
      '<div id="sets-extra"></div>',
    footHtml:
      '<button class="btn btn-secondary" id="cat-cancel">Cancelar</button>' +
      '<button class="btn btn-primary" id="cat-save">'+(isEdit?'Guardar cambios':'Agregar categoría')+'</button>',
    onMount:(root)=>{
      const formatExtra = root.querySelector('#format-extra');
      const setsExtra = root.querySelector('#sets-extra');
      function refreshExtras(){
        const fmt = root.querySelector('#c-format').value;
        const sport = root.querySelector('#c-sport').value;
        const needsGroups = formatInfo(fmt).needsGroups;
        formatExtra.innerHTML = needsGroups ?
          '<div class="form-row">' +
            '<div class="field"><label for="c-gsize">Equipos por zona (aprox.)</label><input class="input" type="number" min="3" max="6" id="c-gsize" value="'+data.groupSize+'"></div>' +
            (formatInfo(fmt).noPlayoffs ? '' : '<div class="field"><label for="c-qual">Clasifican por zona a playoffs</label><input class="input" type="number" min="1" max="4" id="c-qual" value="'+data.qualifiersPerGroup+'"></div>') +
          '</div>' : '';
        const mode = sportInfo(sport).scoringMode;
        setsExtra.innerHTML = mode==='SETS' ?
          '<div class="form-row">' +
            '<div class="field"><label for="c-sets">Sets para ganar el partido</label><select class="input" id="c-sets"><option value="1" '+(data.setsToWin===1?'selected':'')+'>1 set</option><option value="2" '+(data.setsToWin===2?'selected':'')+'>2 de 3 sets</option></select></div>' +
            '<div class="field" style="justify-content:flex-end;"><div class="checkbox-row"><input type="checkbox" id="c-super" '+(data.superTiebreak?'checked':'')+'><label for="c-super">Tercer set con súper tie-break a 10</label></div></div>' +
          '</div>' :
          '<div class="note-box">'+icon('info')+'<span>Este deporte usa marcador directo (goles), no sets.</span></div>';
      }
      refreshExtras();
      root.querySelector('#c-format').addEventListener('change', refreshExtras);
      root.querySelector('#c-sport').addEventListener('change', refreshExtras);
      root.querySelectorAll('[data-preset]').forEach(chip=> chip.addEventListener('click', ()=>{
        root.querySelectorAll('[data-preset]').forEach(c=>c.classList.remove('is-active'));
        chip.classList.add('is-active');
        const p = chip.getAttribute('data-preset');
        if(p!=='custom') root.querySelector('#c-max').value = p;
      }));
      root.querySelector('#cat-cancel').addEventListener('click', closeModal);
      root.querySelector('#cat-save').addEventListener('click', ()=>{
        const name = root.querySelector('#c-name').value.trim();
        if(!name){ showToast('Ingresá un nombre para la categoría', 'error'); return; }
        const maxTeams = Number(root.querySelector('#c-max').value) || 8;
        if(maxTeams < 2){ showToast('El cupo mínimo es de 2 equipos', 'error'); return; }
        const sport = root.querySelector('#c-sport').value;
        const format = root.querySelector('#c-format').value;
        const payload = {
          name, sport, format, maxTeams,
          entryFee: Number(root.querySelector('#c-fee').value)||0,
          groupSize: formatInfo(format).needsGroups ? (Number(root.querySelector('#c-gsize')?.value)||4) : 4,
          qualifiersPerGroup: (formatInfo(format).needsGroups && !formatInfo(format).noPlayoffs) ? (Number(root.querySelector('#c-qual')?.value)||2) : 2,
          setsToWin: sportInfo(sport).scoringMode==='SETS' ? Number(root.querySelector('#c-sets')?.value)||2 : 2,
          superTiebreak: sportInfo(sport).scoringMode==='SETS' ? !!root.querySelector('#c-super')?.checked : true,
        };
        closeModal();
        onSave(payload);
      });
    }
  });
}

/* ---------------------------- WORKSPACE DEL TORNEO ---------------------------- */
function renderTournamentWorkspace(content){
  const t = activeTournament();
  if(!t){ state.view='dashboard'; return renderDashboard(content); }
  const st = tournamentComputedStatus(t);
  const cat = activeCategory();

  content.innerHTML =
    '<div class="page-head">' +
      '<div><h1>'+escapeHtml(t.name)+'</h1>' +
        '<p class="sub">'+icon('calendar')+' '+fmtDate(t.date)+(t.venue? '  ·  '+icon('map')+' '+escapeHtml(t.venue):'')+'  ·  '+icon('clock')+' '+(t.timeSlots?t.timeSlots.length:0)+' franjas horarias</p>' +
      '</div>' +
      '<div class="head-actions">' +
        '<span class="badge badge-'+st.tone+'" style="align-self:center;"><span class="badge-dot"></span>'+st.label+'</span>' +
        '<button class="btn btn-outline btn-sm" id="tour-settings">'+icon('settings')+' Configuración y Franjas</button>' +
        (t.manualStatus!=='CANCELLED' ? '<button class="btn btn-ghost btn-sm" id="tour-cancel">Cancelar torneo</button>' : '') +
      '</div>' +
    '</div>' +
    '<div class="chip-row" id="cat-chips" style="margin-bottom:20px;"></div>' +
    '<div id="cat-workspace"></div>';

  const chips = content.querySelector('#cat-chips');
  chips.innerHTML =
    t.categories.map(c=> '<button class="chip '+(state.activeCategoryId===c.id?'is-active':'')+'" data-cat="'+c.id+'">'+escapeHtml(c.name)+'</button>').join('') +
    '<button class="chip chip-add" id="chip-add-cat">'+icon('plus')+' Categoría</button>';
  chips.querySelectorAll('[data-cat]').forEach(b=> b.addEventListener('click', ()=>{
    state.activeCategoryId = b.getAttribute('data-cat'); state.tournamentTab='equipos'; render();
  }));
  chips.querySelector('#chip-add-cat').addEventListener('click', ()=> openCategoryFormModal(null, (data)=>{
    const newCat = createCategory(Object.assign({tournamentId:t.id}, data));
    t.categories.push(newCat);
    state.activeCategoryId = newCat.id;
    showToast('Categoría agregada', 'success');
    render();
  }));

  content.querySelector('#tour-settings').addEventListener('click', ()=> openTournamentSettingsModal(t));
  const cancelBtn = content.querySelector('#tour-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=> confirmDialog({
    title:'Cancelar torneo',
    message:'El torneo quedará marcado como cancelado. Los datos cargados no se pierden.',
    confirmLabel:'Cancelar torneo', danger:true,
    onConfirm:()=>{ t.manualStatus='CANCELLED'; showToast('Torneo cancelado', 'info'); render(); }
  }));

  const wsRoot = content.querySelector('#cat-workspace');
  if(!cat){
    wsRoot.innerHTML =
      '<div class="empty-state"><div class="es-icon">'+icon('list')+'</div><h3>Agregá una categoría</h3>' +
      '<p>Cada categoría tiene su propio cupo, formato y cuadro de partidos.</p></div>';
    return;
  }
  renderCategoryWorkspace(wsRoot, t, cat);
}

function openTournamentSettingsModal(t){
  openModal({
    title:'Configuración del torneo', wide:true,
    bodyHtml:
      '<div class="section-title">Franjas horarias con fechas reales de calendario</div>' +
      '<p class="help-text">Agregá o quitá franjas horarias. Si elegís el mismo día en el calendario, el sistema rechaza automáticamente franjas superpuestas o coincidentes.</p>' +
      '<div class="mini-list" id="ts-slots"></div>' +
      '<div style="background:var(--surface-2);padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:20px;">' +
        '<div style="font-size:12px;font-weight:600;margin-bottom:8px;">Nueva franja horaria:</div>' +
        '<div class="form-row-3" style="align-items:flex-end;">' +
          '<div class="field" style="margin-bottom:0;"><label for="ts-slot-date">Día (calendario)</label><input class="input" type="date" id="ts-slot-date" value="'+t.date+'"></div>' +
          '<div class="field" style="margin-bottom:0;"><label for="ts-slot-start">Desde</label><input class="input" type="time" id="ts-slot-start" value="09:00"></div>' +
          '<div class="field" style="margin-bottom:0;"><label for="ts-slot-end">Hasta</label><input class="input" type="time" id="ts-slot-end" value="12:00"></div>' +
        '</div>' +
        '<button class="btn btn-outline btn-sm" id="ts-add-slot" style="margin-top:10px;">'+icon('plus')+' Agregar franja</button>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<div class="section-title">Información general y canchas</div>' +
      '<div class="form-row">' +
        '<div class="field"><label for="ts-venue">Sede / lugar</label><input class="input" id="ts-venue" value="'+escapeHtml(t.venue)+'"></div>' +
        '<div class="field"><label for="ts-date">Fecha de inicio</label><input class="input" type="date" id="ts-date" value="'+t.date+'"></div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="field"><label for="ts-start">Hora inicio general</label><input class="input" type="time" id="ts-start" value="'+t.startTime+'"></div>' +
        '<div class="field"><label for="ts-end">Hora fin general</label><input class="input" type="time" id="ts-end" value="'+t.endTime+'"></div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="field"><label for="ts-dur">Duración de partido (min)</label><input class="input" type="number" min="20" step="5" id="ts-dur" value="'+t.matchDuration+'"></div>' +
        '<div class="field"><label for="ts-rest">Descanso mínimo (min)</label><input class="input" type="number" min="0" step="5" id="ts-rest" value="'+t.restTime+'"></div>' +
      '</div>' +
      '<div class="field"><label for="ts-pay">Método de pago</label><select class="input" id="ts-pay">' +
        '<option value="MANUAL" '+(t.paymentMethod==='MANUAL'?'selected':'')+'>Transferencia / pago manual</option>' +
        '<option value="GATEWAY" '+(t.paymentMethod==='GATEWAY'?'selected':'')+'>Pasarela (Mercado Pago / Stripe)</option>' +
      '</select></div>' +
      '<div class="field"><label>Canchas</label><div class="mini-list" id="ts-courts"></div><button class="btn btn-outline btn-sm" id="ts-add-court">'+icon('plus')+' Agregar cancha</button>' +
        (t.categories.some(cat=>cat.matches.some(m=>m.court))?'<div class="hint">No se pueden quitar canchas con partidos asignados.</div>':'')+'</div>',
    footHtml:
      '<button class="btn btn-secondary" id="ts-cancel">Cancelar</button>' +
      '<button class="btn btn-primary" id="ts-save">Guardar cambios</button>',
    onMount:(root)=>{
      let courts = t.courts.map(c=>Object.assign({},c));
      let timeSlots = (t.timeSlots||[]).map(s=>Object.assign({},s));

      function renderSlots(){
        root.querySelector('#ts-slots').innerHTML = timeSlots.map((s,idx)=>
          '<div class="mini-list-item"><span class="name">'+icon('clock')+' '+escapeHtml(s.label)+'</span>' +
          '<button class="icon-btn" data-rm-slot="'+idx+'" '+(t.categories.some(cat=>[...cat.teams,...cat.waitlist].some(team=>(team.availableSlots||[]).includes(s.id)))?'disabled':'')+' aria-label="Quitar franja" title="'+(t.categories.some(cat=>[...cat.teams,...cat.waitlist].some(team=>(team.availableSlots||[]).includes(s.id)))?'No se puede quitar: hay equipos que eligieron esta franja.':'Quitar franja')+'">'+icon('trash')+'</button></div>'
        ).join('');
        root.querySelectorAll('[data-rm-slot]').forEach(b=> b.addEventListener('click', ()=>{
          timeSlots.splice(Number(b.getAttribute('data-rm-slot')),1); renderSlots();
        }));
      }
      renderSlots();

      root.querySelector('#ts-add-slot').addEventListener('click', ()=>{
        const date = root.querySelector('#ts-slot-date').value;
        const start = root.querySelector('#ts-slot-start').value;
        const end = root.querySelector('#ts-slot-end').value;

        if(!date){ showToast('Seleccioná una fecha en el calendario', 'error'); return; }
        if(!start || !end){ showToast('Ingresá hora de inicio y de fin', 'error'); return; }

        const check = checkSlotOverlap(date, start, end, timeSlots);
        if(check.error){
          showToast(check.error, 'error');
          return;
        }

        timeSlots.push({
          id: uid('slot'),
          date,
          startTime: start,
          endTime: end,
          label: formatSlotLabel(date, start, end)
        });
        sortTimeSlots(timeSlots);
        renderSlots();
      });

      function renderCourts(){
        root.querySelector('#ts-courts').innerHTML = courts.map((c,idx)=>
          '<div class="mini-list-item"><span class="name">'+icon('court')+' '+escapeHtml(c.name)+'</span>' +
          '<button class="icon-btn" data-rm="'+idx+'" '+(courts.length<=1 || t.categories.some(cat=>cat.matches.some(m=>m.court===c.id))?'disabled':'')+' aria-label="Quitar" title="'+(t.categories.some(cat=>cat.matches.some(m=>m.court===c.id))?'No se puede quitar: hay partidos asignados a esta cancha.':'Quitar cancha')+'">'+icon('trash')+'</button></div>'
        ).join('');
        root.querySelectorAll('[data-rm]').forEach(b=> b.addEventListener('click', ()=>{ courts.splice(Number(b.getAttribute('data-rm')),1); renderCourts(); }));
      }
      renderCourts();
      root.querySelector('#ts-add-court').addEventListener('click', ()=>{ courts.push({id:uid('c'), name:'Cancha '+(courts.length+1)}); renderCourts(); });
      root.querySelector('#ts-cancel').addEventListener('click', closeModal);
      root.querySelector('#ts-save').addEventListener('click', ()=>{
        t.venue = root.querySelector('#ts-venue').value.trim();
        t.date = root.querySelector('#ts-date').value || t.date;
        t.startTime = root.querySelector('#ts-start').value || t.startTime;
        t.endTime = root.querySelector('#ts-end').value || t.endTime;
        t.matchDuration = Number(root.querySelector('#ts-dur').value)||t.matchDuration;
        t.restTime = Number(root.querySelector('#ts-rest').value)||t.restTime;
        t.paymentMethod = root.querySelector('#ts-pay').value;
        t.courts = courts;
        t.timeSlots = timeSlots;
        closeModal();
        showToast('Configuración actualizada', 'success');
        render();
      });
    }
  });
}

/* ---------------------------- CATEGORY WORKSPACE (TABS) ---------------------------- */
function renderCategoryWorkspace(root, t, cat){
  const fmt = formatInfo(cat.format);
  const csi = categoryStatusInfo(cat);
  const tabs = [
    {key:'equipos', label:'Equipos', icon:'users'},
  ];
  if(cat.status!=='REGISTRATION'){
    if(fmt.needsGroups) tabs.push({key:'grupos', label:'Zonas', icon:'grid'});
    if(!fmt.noPlayoffs) tabs.push({key:'cuadro', label:'Cuadro', icon:'trophy'});
    tabs.push({key:'programacion', label:'Programación', icon:'calendar'});
  }

  if(!state.tournamentTab || !tabs.find(x=>x.key===state.tournamentTab)) state.tournamentTab = 'equipos';

  root.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:4px;">' +
      '<div style="display:flex;align-items:center;gap:10px;">' +
        '<span class="badge badge-'+csi.tone+'"><span class="badge-dot"></span>'+csi.label+'</span>' +
        '<span class="badge badge-neutral">'+sportInfo(cat.sport).label+'</span>' +
        '<span class="badge badge-neutral">'+fmt.label+'</span>' +
      '</div>' +
      '<div class="head-actions" id="cat-actions"></div>' +
    '</div>' +
    '<div class="tabbar" id="cat-tabbar"></div>' +
    '<div id="cat-tab-content"></div>';

  const actions = root.querySelector('#cat-actions');
  if(cat.status==='REGISTRATION'){
    const ready = cat.teams.length>=2;
    actions.innerHTML = '<button class="btn btn-primary" id="close-reg" '+(ready?'':'disabled')+'>'+icon('zap')+' Cerrar inscripciones y generar '+(fmt.needsGroups?'zonas':'cuadro')+'</button>';
    actions.querySelector('#close-reg').addEventListener('click', ()=>{
      if(cat.teams.length < 2){ showToast('Necesitás al menos 2 equipos', 'error'); return; }
      confirmDialog({
        title:'Cerrar inscripciones',
        message: 'Se genera '+(fmt.needsGroups? 'la distribución de zonas' : 'el cuadro de eliminación')+' con los '+cat.teams.length+' equipos inscriptos.',
        confirmLabel:'Generar', danger:false,
        onConfirm:()=>{
          generateCategoryStructure(t, cat);
          state.tournamentTab = fmt.needsGroups ? 'grupos' : 'cuadro';
          showToast('Estructura generada', 'success');
          render();
        }
      });
    });
  } else {
    actions.innerHTML = '<button class="btn btn-outline btn-sm" id="edit-cat">'+icon('edit')+' Editar</button>';
    actions.querySelector('#edit-cat').addEventListener('click', ()=> showToast('Los ajustes de formato quedan fijos una vez generado el cuadro para no romper los cruces.', 'info'));
  }

  const tabbar = root.querySelector('#cat-tabbar');
  tabbar.innerHTML = tabs.map(tb=>'<button class="tab-btn '+(state.tournamentTab===tb.key?'is-active':'')+'" data-tab="'+tb.key+'">'+icon(tb.icon)+' '+tb.label+'</button>').join('');
  tabbar.querySelectorAll('[data-tab]').forEach(b=> b.addEventListener('click', ()=>{ state.tournamentTab=b.getAttribute('data-tab'); render(); }));

  const tabContent = root.querySelector('#cat-tab-content');
  if(state.tournamentTab==='equipos') renderTeamsTab(tabContent, t, cat);
  else if(state.tournamentTab==='grupos') renderGroupsTab(tabContent, t, cat);
  else if(state.tournamentTab==='cuadro') renderBracketTab(tabContent, t, cat);
  else if(state.tournamentTab==='programacion') renderScheduleTab(tabContent, t, cat);
}

/* ---------------------------- TAB: EQUIPOS / PAREJAS ---------------------------- */
function renderTeamsTab(root, t, cat){
  const locked = cat.status!=='REGISTRATION';
  const isPadel = cat.sport === 'PADEL';
  root.innerHTML =
    (locked ? '<div class="note-box" style="margin-bottom:16px;">'+icon('info')+'<span>Las inscripciones de esta categoría están cerradas. El listado es de solo lectura.</span></div>' : '') +
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;">' +
      '<div class="sub" style="color:var(--text-dim);font-size:13px;">'+cat.teams.length+' de '+cat.maxTeams+' cupos'+(cat.waitlist.length? '  ·  '+cat.waitlist.length+' en lista de espera':'')+'</div>' +
      (locked? '' : '<button class="btn btn-primary btn-sm" id="add-team">'+icon('plus')+' '+(isPadel?'Agregar pareja':'Agregar equipo')+'</button>') +
    '</div>' +
    '<div id="teams-table-wrap"></div>' +
    (cat.waitlist.length ? '<div class="section-title" style="margin-top:22px;">Lista de espera</div><div id="waitlist-table-wrap"></div>' : '');

  function teamRow(team, idx, isWaitlist){
    const slotBadges = (team.availableSlots || []).map(sId => {
      const slotObj = (t.timeSlots || []).find(s => s.id === sId);
      const label = slotObj ? slotObj.label : sId;
      return '<span class="badge badge-neutral" style="font-size:10.5px;padding:3px 8px;">'+icon('clock')+' '+escapeHtml(label)+'</span>';
    }).join(' ');

    return '<tr>' +
      '<td class="rank-num">'+(idx+1)+'</td>' +
      '<td>' +
        '<div class="team-cell">' +
          '<strong>'+escapeHtml(team.name)+'</strong>' +
          (isPadel
            ? (slotBadges ? '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;">'+slotBadges+'</div>' : '<span class="p2" style="color:var(--warning)">Sin franjas asignadas</span>')
            : '<span class="p2">'+escapeHtml(team.player1)+(team.player2?' / '+escapeHtml(team.player2):'')+'</span>'
          ) +
        '</div>' +
      '</td>' +
      '<td>'+(team.seed? '<span class="badge badge-accent">Cabeza de serie '+team.seed+'</span>' : '<span style="color:var(--text-faint)">—</span>')+'</td>' +
      '<td style="text-align:right;">' +
        (locked ? '' :
          '<button class="icon-btn" data-edit-team="'+team.id+'" aria-label="Editar">'+icon('edit')+'</button> ' +
          '<button class="icon-btn" data-rm-team="'+team.id+'" aria-label="Quitar">'+icon('trash')+'</button>'
        ) +
      '</td>' +
    '</tr>';
  }

  const tw = root.querySelector('#teams-table-wrap');
  if(cat.teams.length===0){
    tw.innerHTML = '<div class="empty-state"><div class="es-icon">'+icon('users')+'</div><h3>'+(isPadel?'Sin parejas todavía':'Sin equipos todavía')+'</h3><p>'+(isPadel?'Cargá las parejas inscriptas para esta categoría.':'Cargá los equipos inscriptos para esta categoría.')+'</p>' +
      (locked? '' : '<div class="es-actions"><button class="btn btn-primary" id="add-team-empty">'+icon('plus')+' '+(isPadel?'Agregar pareja':'Agregar equipo')+'</button></div>') + '</div>';
    if(!locked) tw.querySelector('#add-team-empty').addEventListener('click', ()=> openTeamFormModal(t, cat, null));
  } else {
    tw.innerHTML = '<div class="table-wrap"><table class="data-table"><thead><tr><th>#</th><th>'+(isPadel?'Pareja':'Equipo')+'</th><th>Siembra</th><th></th></tr></thead><tbody>' +
      cat.teams.map((team,idx)=>teamRow(team,idx,false)).join('') + '</tbody></table></div>';
  }
  if(cat.waitlist.length){
    root.querySelector('#waitlist-table-wrap').innerHTML =
      '<div class="table-wrap"><table class="data-table"><thead><tr><th>#</th><th>'+(isPadel?'Pareja':'Equipo')+'</th><th></th><th></th></tr></thead><tbody>' +
      cat.waitlist.map((team,idx)=>teamRow(team,idx,true)).join('') + '</tbody></table></div>';
  }

  if(!locked){
    const addBtn = root.querySelector('#add-team');
    if(addBtn) addBtn.addEventListener('click', ()=> openTeamFormModal(t, cat, null));
    root.querySelectorAll('[data-edit-team]').forEach(b=> b.addEventListener('click', ()=>{
      const team = cat.teams.find(x=>x.id===b.getAttribute('data-edit-team')) || cat.waitlist.find(x=>x.id===b.getAttribute('data-edit-team'));
      openTeamFormModal(t, cat, team);
    }));
    root.querySelectorAll('[data-rm-team]').forEach(b=> b.addEventListener('click', ()=>{
      const id = b.getAttribute('data-rm-team');
      confirmDialog({
        title: isPadel ? 'Quitar pareja' : 'Quitar equipo',
        message: 'Se elimina la inscripción. Esta acción no se puede deshacer.',
        confirmLabel:'Quitar', danger:true,
        onConfirm:()=>{
          const wasRegistered = cat.teams.some(x=>x.id===id);
          cat.teams = cat.teams.filter(x=>x.id!==id);
          cat.waitlist = cat.waitlist.filter(x=>x.id!==id);
          if(wasRegistered && cat.waitlist.length>0 && cat.teams.length < cat.maxTeams){
            const promoted = cat.waitlist.shift();
            cat.teams.push(promoted);
            showToast(promoted.name+' pasó de lista de espera a inscripto', 'success');
          } else {
            showToast(isPadel ? 'Pareja eliminada' : 'Equipo eliminado', 'info');
          }
          render();
        }
      });
    }));
  }
}

function openTeamFormModal(t, cat, existing){
  const isEdit = !!existing;
  const isPadel = cat.sport === 'PADEL';
  const data = existing || {name:'', player1:'', player2:'', seed:null, availableSlots:[]};
  const isFull = cat.teams.length >= cat.maxTeams && !isEdit;
  const availableSlotsList = t.timeSlots || [];

  let slotsHtml = '';
  if (isPadel) {
    if (availableSlotsList.length === 0) {
      slotsHtml = '<div class="confirm-warning">'+icon('alert')+'<span>El organizador no configuró franjas horarias todavía. Podés agregarlas desde "Configuración y Franjas".</span></div>';
    } else {
      slotsHtml =
        '<div class="field" style="margin-top:10px;">' +
          '<label>Franjas horarias disponibles <span class="hint">(Mínimo 2 franjas obligatorias)</span></label>' +
          '<div style="display:flex;flex-direction:column;gap:4px;background:var(--surface-2);padding:10px 12px;border-radius:10px;border:1px solid var(--border);max-height:180px;overflow-y:auto;">' +
            availableSlotsList.map(s => {
              const checked = (data.availableSlots || []).includes(s.id);
              return '<div class="checkbox-row" style="padding:4px 0;">' +
                '<input type="checkbox" id="slot-cb-'+s.id+'" value="'+s.id+'" name="team-slot" '+(checked?'checked':'')+'>' +
                '<label for="slot-cb-'+s.id+'" style="font-size:13px;">'+escapeHtml(s.label)+'</label>' +
              '</div>';
            }).join('') +
          '</div>' +
          '<div id="slots-error" class="error-msg"></div>' +
        '</div>';
    }
  }

  openModal({
    title: isEdit ? (isPadel ? 'Editar pareja' : 'Editar equipo') : (isPadel ? 'Agregar pareja' : 'Agregar equipo'),
    subtitle: isFull ? 'El cupo está completo: este registro va a la lista de espera.' : undefined,
    bodyHtml:
      (isPadel ? '' : '<div class="field"><label for="tm-name">Nombre del equipo</label><input class="input" id="tm-name" value="'+escapeHtml(data.name)+'" placeholder="Ej: Los Zurdos"></div>') +
      '<div class="form-row">' +
        '<div class="field"><label for="tm-p1">Jugador 1</label><input class="input" id="tm-p1" value="'+escapeHtml(data.player1)+'" placeholder="Nombre y apellido"></div>' +
        '<div class="field"><label for="tm-p2">Jugador 2'+(isPadel ? '' : ' <span class="hint">(si aplica)</span>')+'</label><input class="input" id="tm-p2" value="'+escapeHtml(data.player2)+'" placeholder="Nombre y apellido"></div>' +
      '</div>' +
      slotsHtml +
      '<div class="field"><label for="tm-seed">Cabeza de serie <span class="hint">(opcional)</span></label><input class="input" type="number" min="1" id="tm-seed" value="'+(data.seed||'')+'"></div>',
    footHtml:
      '<button class="btn btn-secondary" id="tm-cancel">Cancelar</button>' +
      '<button class="btn btn-primary" id="tm-save">'+(isEdit?'Guardar':(isFull?'Agregar a lista de espera':(isPadel?'Agregar pareja':'Agregar equipo')))+'</button>',
    onMount:(root)=>{
      root.querySelector('#tm-cancel').addEventListener('click', closeModal);
      root.querySelector('#tm-save').addEventListener('click', ()=>{
        const p1 = root.querySelector('#tm-p1').value.trim();
        const p2 = root.querySelector('#tm-p2').value.trim();
        let name = '';

        if (isPadel) {
          if (!p1 || !p2) {
            showToast('Ingresá el nombre de ambos jugadores de la pareja', 'error');
            return;
          }
          name = p1 + ' / ' + p2;
        } else {
          name = root.querySelector('#tm-name').value.trim();
          if(!name){ showToast('Ingresá el nombre del equipo', 'error'); return; }
        }

        let selectedSlots = [];
        if (isPadel && availableSlotsList.length > 0) {
          selectedSlots = Array.from(root.querySelectorAll('input[name="team-slot"]:checked')).map(cb => cb.value);
          const errEl = root.querySelector('#slots-error');
          if (availableSlotsList.length >= 2 && selectedSlots.length < 2) {
            errEl.textContent = 'Debés seleccionar al menos 2 franjas horarias.';
            showToast('Debés seleccionar un mínimo de 2 franjas horarias', 'error');
            return;
          }
          errEl.textContent = '';
        }

        const payload = {
          name,
          player1: p1,
          player2: p2,
          availableSlots: selectedSlots,
          seed: Number(root.querySelector('#tm-seed').value) || null,
        };

        if(isEdit){
          Object.assign(existing, payload);
          showToast(isPadel ? 'Pareja actualizada' : 'Equipo actualizado', 'success');
        } else {
          const team = createTeam(payload);
          if(cat.teams.length >= cat.maxTeams){
            cat.waitlist.push(team);
            showToast(name+' quedó en lista de espera (cupo completo)', 'info');
          } else {
            cat.teams.push(team);
            showToast(isPadel ? 'Pareja agregada' : 'Equipo agregado', 'success');
          }
        }
        closeModal();
        render();
      });
    }
  });
}

/* ---------------------------- TAB: ZONAS ---------------------------- */
function renderGroupsTab(root, t, cat){
  const allDone = allGroupMatchesFinished(cat);
  const noPlayoffs = formatInfo(cat.format).noPlayoffs;
  let championHtml = '';
  if(noPlayoffs && allDone && cat.groups.length){
    const combined = cat.groups.flatMap(g=> computeStandings(cat, g).map(r=>Object.assign({groupName:g.name}, r)));
    combined.sort((a,b)=> b.points-a.points || (b.diff-a.diff));
    const winner = combined[0];
    const champTeam = winner ? getTeam(cat, winner.teamId) : null;
    if(champTeam){
      championHtml = '<div class="champion-banner"><div class="cup">'+icon('trophy')+'</div><div><div class="ctitle">Campeón — '+escapeHtml(cat.name)+'</div><div class="cname">'+escapeHtml(champTeam.name)+'</div></div></div>';
    }
  }
  root.innerHTML =
    championHtml +
    (cat.playoffGenerated ? '<div class="note-box" style="margin-bottom:16px;">'+icon('checkCircle')+'<span>Los playoffs ya fueron generados a partir de estas zonas. Mirá la pestaña Cuadro.</span></div>' :
      (allDone && !noPlayoffs) ? '<div class="note-box" style="margin-bottom:16px;">'+icon('zap')+'<span>Todos los partidos de zonas están finalizados.</span> <button class="btn btn-primary btn-sm" id="gen-playoffs" style="margin-left:auto;">Generar llave de playoffs</button></div>' : '') +
    '<div class="group-grid" id="groups-grid"></div>';

  const grid = root.querySelector('#groups-grid');
  grid.innerHTML = cat.groups.map(g=>{
    const standings = computeStandings(cat, g);
    const groupMatches = cat.matches.filter(m=>m.groupId===g.id);
    const qualCount = formatInfo(cat.format).noPlayoffs ? 0 : cat.qualifiersPerGroup;
    return '<div class="card group-card">' +
      '<h4>'+escapeHtml(g.name)+'</h4>' +
      '<div class="table-wrap"><table class="data-table"><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>PG</th><th>PP</th><th>Dif</th><th>Pts</th></tr></thead><tbody>' +
      standings.map((r,idx)=>{
        const team = getTeam(cat, r.teamId);
        return '<tr class="'+(idx<qualCount?'is-top':'')+'">' +
          '<td class="rank-num">'+(idx+1)+'</td>' +
          '<td>'+escapeHtml(team? team.name:'—')+'</td>' +
          '<td>'+r.pj+'</td><td>'+r.pg+'</td><td>'+r.pp+'</td>' +
          '<td>'+(r.diff>0?'+':'')+r.diff+'</td><td><strong>'+r.points+'</strong></td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="group-matches">' +
        groupMatches.map(m=> matchGroupRowHtml(cat, m)).join('') +
      '</div>' +
    '</div>';
  }).join('');

  grid.querySelectorAll('[data-match]').forEach(el=> el.addEventListener('click', ()=>{
    openResultModal(t, cat, getMatch(cat, el.getAttribute('data-match')));
  }));
  const genBtn = root.querySelector('#gen-playoffs');
  if(genBtn) genBtn.addEventListener('click', ()=>{
    generatePlayoffsFromGroups(cat);
    state.tournamentTab = 'cuadro';
    showToast('Llave de playoffs generada', 'success');
    render();
  });
}

function matchGroupRowHtml(cat, m){
  const t1 = getTeam(cat, m.team1Id), t2 = getTeam(cat, m.team2Id);
  const finished = ['FINISHED','WALKOVER'].includes(m.status);
  const scoreTxt = finished ? matchScoreText(cat, m) : (m.status==='SCHEDULED' ? (m.scheduledDate ? fmtDate(m.scheduledDate)+' · ' : '')+fmtMinutes(m.scheduledStart)+(m.court?' · '+courtNameById(cat,m):'') : 'Sin programar');
  return '<div class="gm-row" data-match="'+m.id+'">' +
    '<div class="gm-teams">' +
      '<span class="'+(m.winnerId===m.team1Id?'win':'')+'">'+escapeHtml(t1?t1.name:'?')+'</span>' +
      '<span class="'+(m.winnerId===m.team2Id?'win':'')+'">'+escapeHtml(t2?t2.name:'?')+'</span>' +
    '</div>' +
    '<span class="gm-score">'+scoreTxt+'</span>' +
  '</div>';
}
function courtNameById(cat, m){
  const t = activeTournament();
  if(!t || !m.court) return '';
  const c = t.courts.find(x=>x.id===m.court);
  return c ? c.name : '';
}
function matchScoreText(cat, m){
  if(m.status==='WALKOVER'){
    const winner = getTeam(cat, m.winnerId);
    return 'WO' + (winner? ' · gana '+winner.name : '');
  }
  if(cat.scoringMode==='SETS'){
    return (m.sets||[]).map(s=> s.t1+'-'+s.t2).join('  ');
  }
  if(m.score) return m.score.a+' - '+m.score.b;
  return '';
}

/* ---------------------------- TAB: CUADRO ---------------------------- */
function renderBracketTab(root, t, cat){
  const bracketMatches = cat.matches.filter(m=>m.stage==='BRACKET');
  if(bracketMatches.length===0){
    root.innerHTML = '<div class="empty-state"><div class="es-icon">'+icon('trophy')+'</div><h3>El cuadro todavía no está generado</h3><p>'+(formatInfo(cat.format).needsGroups? 'Se genera automáticamente cuando terminen los partidos de zonas.' : '')+'</p></div>';
    return;
  }
  const rounds = {};
  bracketMatches.forEach(m=>{ (rounds[m.round]=rounds[m.round]||[]).push(m); });
  const roundKeys = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  const finalMatch = rounds[roundKeys[roundKeys.length-1]][0];
  const championId = finalMatch && ['FINISHED','WALKOVER'].includes(finalMatch.status) ? finalMatch.winnerId : null;

  let html = '';
  if(championId){
    const champ = getTeam(cat, championId);
    html += '<div class="champion-banner"><div class="cup">'+icon('trophy')+'</div><div><div class="ctitle">Campeón — '+escapeHtml(cat.name)+'</div><div class="cname">'+escapeHtml(champ?champ.name:'')+'</div></div></div>';
  }

  html += '<div class="bracket-scroll"><div class="bracket">' +
    roundKeys.map(rk=>{
      const ms = rounds[rk].slice().sort((a,b)=>a.slot-b.slot);
      return '<div class="bracket-round"><div class="bracket-round-title">'+escapeHtml(ms[0].label)+'</div>' +
        '<div class="bracket-col">' + ms.map(m=> matchCardHtml(cat, m)).join('') + '</div></div>';
    }).join('') +
  '</div></div>';

  root.innerHTML = html;
  root.querySelectorAll('[data-match]').forEach(el=> el.addEventListener('click', ()=>{
    const m = getMatch(cat, el.getAttribute('data-match'));
    if(!m.team1Id || !m.team2Id) return;
    openResultModal(t, cat, m);
  }));
}

function matchCardHtml(cat, m){
  const t1 = getTeam(cat, m.team1Id), t2 = getTeam(cat, m.team2Id);
  const clickable = m.team1Id && m.team2Id;
  const tbd = !m.team1Id || !m.team2Id;
  const label1 = t1 ? t1.name : (m.team1Source || 'Por definir');
  const label2 = t2 ? t2.name : (m.team2Source || 'Por definir');
  const finished = ['FINISHED','WALKOVER','BYE'].includes(m.status);
  let sets1='', sets2='';
  if(finished && cat.scoringMode==='SETS' && m.sets.length){
    sets1 = m.sets.map(s=>s.t1).join(' ');
    sets2 = m.sets.map(s=>s.t2).join(' ');
  } else if(finished && cat.scoringMode==='SCORE' && m.score){
    sets1 = m.score.a; sets2 = m.score.b;
  }
  const metaTxt = m.status==='BYE' ? 'BYE' : m.status==='SCHEDULED' ? (m.scheduledDate ? fmtDate(m.scheduledDate)+' · ' : '')+fmtMinutes(m.scheduledStart)+' · '+courtNameById(cat,m) : m.status==='WALKOVER' ? 'Walkover' : finished ? 'Finalizado' : 'Sin programar';
  return '<div class="match-card '+(clickable?'is-clickable':'')+' '+(tbd?'is-tbd':'')+'" '+(clickable?'data-match="'+m.id+'"':'')+'>' +
    '<div class="match-slot '+(m.winnerId && m.winnerId===m.team1Id?'is-winner':'')+'">'+
      '<span>'+escapeHtml(label1)+'</span><span class="score">'+sets1+'</span></div>' +
    '<div class="match-slot '+(m.winnerId && m.winnerId===m.team2Id?'is-winner':'')+'">'+
      '<span>'+escapeHtml(label2)+'</span><span class="score">'+sets2+'</span></div>' +
    (m.status!=='PENDING' ? '<div class="match-meta"><span>'+metaTxt+'</span></div>' : '') +
  '</div>';
}

/* ---------------------------- TAB: PROGRAMACIÓN ---------------------------- */
function renderScheduleTab(root, t, cat){
  const pendingReady = t.categories.reduce((s,c)=> s + c.matches.filter(m=>m.status==='PENDING' && m.team1Id && m.team2Id).length, 0);
  const scheduledAny = t.categories.some(c=> c.matches.some(m=> m.status==='SCHEDULED' || m.status==='LIVE'));

  root.innerHTML =
    '<div class="schedule-toolbar">' +
      '<div style="flex:2;min-width:220px;">' +
        '<div style="font-size:12.5px;color:var(--text-dim);">Franja general diaria: <strong>'+t.startTime+' – '+t.endTime+'</strong> · Partidos de <strong>'+t.matchDuration+' min</strong> · descanso <strong>'+t.restTime+' min</strong> · '+t.courts.length+' cancha'+(t.courts.length===1?'':'s')+'</div>' +
      '</div>' +
      '<button class="btn btn-primary btn-sm" id="gen-sched" '+(pendingReady===0?'disabled':'')+'>'+icon('zap')+' Generar programación'+(pendingReady?' ('+pendingReady+' pendientes)':'')+'</button>' +
      (scheduledAny? '<button class="btn btn-ghost btn-sm" id="reset-sched">Reiniciar horarios pendientes</button>' : '') +
    '</div>' +
    '<div id="sched-body"></div>';

  root.querySelector('#gen-sched').addEventListener('click', ()=>{
    const res = generateSchedule(t);
    if(res.scheduledCount===0 && res.unscheduledCount===0){ showToast('No hay partidos listos para programar todavía', 'info'); render(); return; }
    if(res.unscheduledCount>0){
      showToast(res.scheduledCount+' partidos programados. '+res.unscheduledCount+' no entraron en la franja horaria: ampliá el horario o sumá canchas.', 'error');
    } else {
      showToast(res.scheduledCount+' partidos programados sin superposiciones', 'success');
    }
    render();
  });
  const resetBtn = root.querySelector('#reset-sched');
  if(resetBtn) resetBtn.addEventListener('click', ()=> confirmDialog({
    title:'Reiniciar horarios pendientes',
    message:'Los partidos programados que todavía no arrancaron vuelven a quedar sin horario asignado.',
    confirmLabel:'Reiniciar',
    onConfirm:()=>{ clearScheduleForPending(t); showToast('Horarios reiniciados', 'info'); render(); }
  }));

  renderScheduleBody(root.querySelector('#sched-body'), t);
}

function renderScheduleBody(body, t){
  const allMatches = [];
  t.categories.forEach(c=> c.matches.forEach(m=>{ if(m.court) allMatches.push({m,c}); }));
  const scheduled = allMatches.filter(x=> ['SCHEDULED','LIVE','FINISHED','WALKOVER'].includes(x.m.status));
  const unscheduled = [];
  t.categories.forEach(c=> c.matches.forEach(m=>{ if(m.status==='PENDING' && m.team1Id && m.team2Id) unscheduled.push({m,c}); }));

  if(scheduled.length===0 && unscheduled.length===0){
    body.innerHTML = '<div class="empty-state"><div class="es-icon">'+icon('calendar')+'</div><h3>Todavía no hay partidos para programar</h3><p>Generá el cuadro o las zonas primero desde la pestaña correspondiente.</p></div>';
    return;
  }

  let html = '<div class="court-columns">';
  t.courts.forEach(court=>{
    const items = scheduled.filter(x=> x.m.court===court.id).sort((a,b)=>
      (a.m.scheduledDate||t.date).localeCompare(b.m.scheduledDate||t.date) || a.m.scheduledStart-b.m.scheduledStart
    );
    html += '<div><div class="court-col-head">'+icon('court')+' '+escapeHtml(court.name)+'<span class="badge badge-neutral">'+items.length+'</span></div>' +
      '<div class="court-col-body">' +
        (items.length===0? '<div style="font-size:12px;color:var(--text-faint);padding:8px;">Sin partidos</div>' :
          items.map(x=>{
            const t1 = getTeam(x.c,x.m.team1Id), t2=getTeam(x.c,x.m.team2Id);
            return '<div class="sched-card" data-match="'+x.m.id+'" data-cat="'+x.c.id+'">' +
              '<div class="time">'+(x.m.scheduledDate ? fmtDate(x.m.scheduledDate)+' · ' : '')+fmtMinutes(x.m.scheduledStart)+' – '+fmtMinutes(x.m.scheduledEnd)+'</div>' +
              '<div class="teams">'+escapeHtml(t1?t1.name:'?')+' vs '+escapeHtml(t2?t2.name:'?')+'</div>' +
              '<div class="cat">'+escapeHtml(x.c.name)+' · '+statusChipText(x.m)+'</div>' +
            '</div>';
          }).join('')
        ) +
      '</div></div>';
  });
  html += '</div>';

  const removedCourtMatches = scheduled.filter(x=>!t.courts.some(court=>court.id===x.m.court));
  if(removedCourtMatches.length){
    html += '<div class="section-title" style="margin-top:22px;">Cancha eliminada ('+removedCourtMatches.length+')</div><div class="unscheduled-list">' +
      removedCourtMatches.map(x=>{
        const t1=getTeam(x.c,x.m.team1Id), t2=getTeam(x.c,x.m.team2Id);
        return '<div class="unsched-row"><span>'+escapeHtml(t1?t1.name:'?')+' vs '+escapeHtml(t2?t2.name:'?')+' <span style="color:var(--text-faint)">· '+escapeHtml(x.c.name)+' · '+(x.m.scheduledDate?fmtDate(x.m.scheduledDate)+' · ':'')+fmtMinutes(x.m.scheduledStart)+'</span></span><span class="badge badge-warn">'+statusChipText(x.m)+'</span></div>';
      }).join('') + '</div>';
  }

  if(unscheduled.length){
    html += '<div class="section-title" style="margin-top:22px;">Sin programar ('+unscheduled.length+')</div><div class="unscheduled-list">' +
      unscheduled.map(x=>{
        const t1=getTeam(x.c,x.m.team1Id), t2=getTeam(x.c,x.m.team2Id);
        return '<div class="unsched-row"><span>'+escapeHtml(t1?t1.name:'?')+' vs '+escapeHtml(t2?t2.name:'?')+' <span style="color:var(--text-faint)">· '+escapeHtml(x.c.name)+'</span></span><span class="badge badge-warn">Pendiente</span></div>';
      }).join('') + '</div>';
  }

  body.innerHTML = html;
  body.querySelectorAll('[data-match]').forEach(el=> el.addEventListener('click', ()=>{
    const c = getCategory(t, el.getAttribute('data-cat'));
    const m = getMatch(c, el.getAttribute('data-match'));
    openResultModal(t, c, m);
  }));
}
function statusChipText(m){
  return {SCHEDULED:'Programado', LIVE:'En juego', FINISHED:'Finalizado', WALKOVER:'Walkover'}[m.status] || m.status;
}

/* ---------------------------- MODAL: CARGAR RESULTADO ---------------------------- */
function nextMatchLockInfo(cat, m){
  if(!m.nextMatchId) return null;
  const next = getMatch(cat, m.nextMatchId);
  if(!next) return null;
  if(next.status==='FINISHED' || next.status==='WALKOVER' || next.status==='LIVE'){
    return next;
  }
  return null;
}

function openResultModal(t, cat, m){
  if(!m || !m.team1Id || !m.team2Id) return;
  const t1 = getTeam(cat, m.team1Id), t2 = getTeam(cat, m.team2Id);
  const isFinished = ['FINISHED','WALKOVER'].includes(m.status);
  const lockedByNext = isFinished ? nextMatchLockInfo(cat, m) : null;

  if(lockedByNext){
    openModal({
      title:'No se puede modificar este resultado',
      bodyHtml:
        '<div class="confirm-warning">'+icon('alert')+'<span>El siguiente partido de la llave ya se disputó (o está en juego) con el equipo que salió de este cruce. Corregir este resultado ahora generaría una inconsistencia en la llave.</span></div>' +
        '<p style="font-size:13px;color:var(--text-dim);">Si igual necesitás corregirlo, primero revertí manualmente el resultado del siguiente partido.</p>',
      footHtml:'<button class="btn btn-primary" id="ok-close">Entendido</button>',
      onMount:(root)=> root.querySelector('#ok-close').addEventListener('click', closeModal),
    });
    return;
  }

  const maxSets = cat.setsToWin>=2 ? 3 : 1;
  const decisiveSetIndex = maxSets-1;
  let localSets = (m.sets && m.sets.length) ? m.sets.map(s=>({t1:s.t1, t2:s.t2})) : [];
  let localScore = m.score ? Object.assign({}, m.score) : {a:'', b:''};

  openModal({
    title:'Cargar resultado',
    subtitle: escapeHtml(t1.name)+' vs '+escapeHtml(t2.name),
    bodyHtml: '<div id="result-form"></div>',
    footHtml:
      '<button class="btn btn-danger" id="res-wo" style="margin-right:auto;">'+icon('flag')+' Walkover</button>' +
      '<button class="btn btn-secondary" id="res-cancel">Cancelar</button>' +
      '<button class="btn btn-primary" id="res-save" disabled>Guardar resultado</button>',
    onMount:(root)=>{
      const formEl = root.querySelector('#result-form');
      const saveBtn = root.querySelector('#res-save');

      function setsDecided(sets){
        let w1=0, w2=0;
        for(const s of sets){ if(s.t1>s.t2) w1++; else if(s.t2>s.t1) w2++; }
        return { w1, w2, done: w1>=cat.setsToWin || w2>=cat.setsToWin, winnerSide: w1>=cat.setsToWin?1:(w2>=cat.setsToWin?2:0) };
      }

      function renderSetsForm(){
        if(cat.scoringMode==='SCORE'){
          formEl.innerHTML =
            '<div class="form-row">' +
              '<div class="field"><label>'+escapeHtml(t1.name)+'</label><input class="input" type="number" min="0" id="sc-a" value="'+localScore.a+'"></div>' +
              '<div class="field"><label>'+escapeHtml(t2.name)+'</label><input class="input" type="number" min="0" id="sc-b" value="'+localScore.b+'"></div>' +
            '</div>' +
            '<div id="sc-error" class="field error-msg"></div>';
          const a = formEl.querySelector('#sc-a'), b = formEl.querySelector('#sc-b');
          function validateScore(){
            const va=a.value, vb=b.value;
            const err = formEl.querySelector('#sc-error');
            if(va===''||vb===''){ err.textContent=''; saveBtn.disabled=true; return; }
            const scoreA = Number(va), scoreB = Number(vb);
            if(!Number.isInteger(scoreA)||!Number.isInteger(scoreB)||scoreA<0||scoreB<0){
              err.textContent = 'Los goles deben ser números enteros mayores o iguales a cero.';
              saveBtn.disabled = true; return;
            }
            if(scoreA===scoreB && m.stage==='BRACKET'){
              err.textContent = 'En instancias de eliminación el partido no puede terminar empatado.';
              saveBtn.disabled = true; return;
            }
            err.textContent=''; saveBtn.disabled=false;
            localScore = {a:scoreA, b:scoreB};
          }
          a.addEventListener('input', validateScore); b.addEventListener('input', validateScore);
          validateScore();
          return;
        }

        const dec = setsDecided(localSets);
        let rowsToShow = Math.min(localSets.length + (dec.done?0:1), maxSets);
        if(rowsToShow===0) rowsToShow=1;
        let rowsHtml = '';
        for(let i=0;i<rowsToShow;i++){
          const isSuper = cat.superTiebreak && i===decisiveSetIndex && maxSets===3;
          const val = localSets[i] || {t1:'',t2:''};
          rowsHtml += '<div class="form-row" data-set-row="'+i+'">' +
            '<div class="field"><label>Set '+(i+1)+(isSuper?' — súper tie-break a 10':'')+' · '+escapeHtml(t1.name)+'</label><input class="input" type="number" min="0" id="set-'+i+'-a" value="'+val.t1+'"></div>' +
            '<div class="field"><label>&nbsp;· '+escapeHtml(t2.name)+'</label><input class="input" type="number" min="0" id="set-'+i+'-b" value="'+val.t2+'"></div>' +
          '</div>';
        }
        formEl.innerHTML = rowsHtml + '<div id="sets-error" class="field error-msg"></div>';

        for(let i=0;i<rowsToShow;i++){
          const ai = formEl.querySelector('#set-'+i+'-a'), bi = formEl.querySelector('#set-'+i+'-b');
          const handler = ()=> onSetInput();
          ai.addEventListener('input', handler); bi.addEventListener('input', handler);
        }

        function onSetInput(){
          const errBox = formEl.querySelector('#sets-error');
          errBox.textContent = '';
          const collected = [];
          for(let i=0;i<rowsToShow;i++){
            const ai = formEl.querySelector('#set-'+i+'-a'), bi = formEl.querySelector('#set-'+i+'-b');
            if(!ai) continue;
            const va = ai.value, vb = bi.value;
            if(va===''&&vb==='') continue;
            const isSuper = cat.superTiebreak && i===decisiveSetIndex && maxSets===3;
            if(va===''||vb===''){ continue; }
            if(!isValidSet(va,vb,isSuper)){
              errBox.textContent = 'El resultado del set '+(i+1)+' no es válido para el reglamento configurado.';
              saveBtn.disabled = true; return;
            }
            collected.push({t1:Number(va), t2:Number(vb)});
          }
          localSets = collected;
          const nowDecided = setsDecided(localSets);
          saveBtn.disabled = !nowDecided.done;
          const wasRowsToShow = rowsToShow;
          const shouldShow = Math.min(localSets.length + (nowDecided.done?0:1), maxSets);
          if(shouldShow !== wasRowsToShow){ renderSetsForm(); }
        }
      }
      renderSetsForm();

      root.querySelector('#res-cancel').addEventListener('click', closeModal);
      root.querySelector('#res-wo').addEventListener('click', ()=>{
        openWalkoverModal(t, cat, m, t1, t2);
      });
      root.querySelector('#res-save').addEventListener('click', ()=>{
        if(cat.scoringMode==='SCORE'){
          m.score = localScore;
          m.winnerId = localScore.a===localScore.b ? null : (localScore.a>localScore.b ? m.team1Id : m.team2Id);
        } else {
          const dec = setsDecided(localSets);
          m.sets = localSets;
          m.winnerId = dec.winnerSide===1 ? m.team1Id : m.team2Id;
        }
        m.status = 'FINISHED';
        if(m.stage==='BRACKET' && m.nextMatchId) propagateWinner(cat.matches, m, m.winnerId);
        maybeFinishCategory(cat);
        closeModal();
        showToast('Resultado guardado', 'success');
        render();
      });
    }
  });
}

function openWalkoverModal(t, cat, m, t1, t2){
  openModal({
    title:'Registrar walkover',
    subtitle:'Se asigna la victoria reglamentaria (6-0 / 6-0) al equipo presente.',
    bodyHtml:
      '<div class="field"><label>¿Qué equipo se presentó a jugar?</label>' +
        '<div class="chip-row">' +
          '<button type="button" class="chip" data-wo="'+m.team1Id+'">'+escapeHtml(t1.name)+'</button>' +
          '<button type="button" class="chip" data-wo="'+m.team2Id+'">'+escapeHtml(t2.name)+'</button>' +
          '<button type="button" class="chip" data-wo="NONE">Ninguno se presentó (doble WO)</button>' +
        '</div>' +
      '</div>',
    footHtml:'<button class="btn btn-secondary" id="wo-cancel">Cancelar</button>',
    onMount:(root)=>{
      root.querySelector('#wo-cancel').addEventListener('click', closeModal);
      root.querySelectorAll('[data-wo]').forEach(chip=> chip.addEventListener('click', ()=>{
        const val = chip.getAttribute('data-wo');
        if(val==='NONE'){
          m.status='WALKOVER'; m.winnerId=null;
          if(cat.scoringMode==='SETS') m.sets=[]; else m.score=null;
          if(m.stage==='BRACKET' && m.nextMatchId){
            const next = getMatch(cat, m.nextMatchId);
            if(next){ if(m.nextSlot===1) next.team1Id=null; else next.team2Id=null; }
          }
        } else {
          const winner = val;
          m.winnerId = winner;
          m.status='WALKOVER';
          if(cat.scoringMode==='SETS'){
            m.sets = [{t1: winner===m.team1Id?6:0, t2: winner===m.team1Id?0:6},{t1: winner===m.team1Id?6:0, t2: winner===m.team1Id?0:6}];
          } else {
            m.score = winner===m.team1Id? {a:3,b:0} : {a:0,b:3};
          }
          if(m.stage==='BRACKET' && m.nextMatchId) propagateWinner(cat.matches, m, winner);
        }
        maybeFinishCategory(cat);
        closeModal();
        showToast('Walkover registrado', 'success');
        render();
      }));
    }
  });
}

function maybeFinishCategory(cat){
  const bracketMatches = cat.matches.filter(m=>m.stage==='BRACKET');
  if(bracketMatches.length){
    const rounds = {};
    bracketMatches.forEach(m=> (rounds[m.round]=rounds[m.round]||[]).push(m));
    const lastRound = Math.max(...Object.keys(rounds).map(Number));
    const final = rounds[lastRound][0];
    if(final && ['FINISHED','WALKOVER'].includes(final.status)){ cat.status='FINISHED'; return; }
  } else if(formatInfo(cat.format).noPlayoffs && cat.groups.length){
    if(allGroupMatchesFinished(cat)){ cat.status='FINISHED'; }
  }
}

/* ---------------------------- INIT ---------------------------- */
function init(){
  const had = loadState();
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('sidebar-scrim').addEventListener('click', closeSidebarMobile);
  render();
}
document.addEventListener('DOMContentLoaded', init);

</script>
