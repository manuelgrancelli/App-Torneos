<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cancha — Gestión de Torneos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --bg:#f6f4ec;
  --bg-elevated:#ffffff;
  --surface:#ffffff;
  --surface-2:#efece0;
  --surface-3:#e6e2d2;
  --border:#dfdac8;
  --border-strong:#cfc9b2;
  --text:#171a13;
  --text-dim:#5c6152;
  --text-faint:#8b9080;
  --accent:#516600;
  --accent-strong:#3d4d00;
  --accent-contrast:#f8ffe0;
  --accent-soft:#e6efc4;
  --accent2:#0d7b6c;
  --accent2-soft:#d7f0ea;
  --danger:#b23a2e;
  --danger-soft:#f8ddd8;
  --warning:#95610a;
  --warning-soft:#f7e6c6;
  --live:#b23a2e;
  --shadow-sm:0 1px 2px rgba(30,28,10,.08);
  --shadow-md:0 6px 20px -8px rgba(30,28,10,.22);
  --shadow-lg:0 20px 48px -16px rgba(30,28,10,.32);
  --radius-sm:8px;
  --radius:14px;
  --radius-lg:22px;
  --font-display:'Bricolage Grotesque', 'Archivo Black', system-ui, sans-serif;
  --font-body:'IBM Plex Sans', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
  --ease:cubic-bezier(.2,.7,.3,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1410;
    --bg-elevated:#141d17;
    --surface:#141d17;
    --surface-2:#1a251d;
    --surface-3:#233024;
    --border:#28362b;
    --border-strong:#354534;
    --text:#eef3e8;
    --text-dim:#a9b39d;
    --text-faint:#71806c;
    --accent:#c7ec4a;
    --accent-strong:#dbfb5f;
    --accent-contrast:#141d05;
    --accent-soft:#25320f;
    --accent2:#33d3b7;
    --accent2-soft:#0f2c28;
    --danger:#ff8f80;
    --danger-soft:#3a1a15;
    --warning:#ffc36a;
    --warning-soft:#3a2c0f;
    --live:#ff8f80;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-md:0 6px 20px -8px rgba(0,0,0,.5);
    --shadow-lg:0 24px 56px -20px rgba(0,0,0,.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1410;
  --bg-elevated:#141d17;
  --surface:#141d17;
  --surface-2:#1a251d;
  --surface-3:#233024;
  --border:#28362b;
  --border-strong:#354534;
  --text:#eef3e8;
  --text-dim:#a9b39d;
  --text-faint:#71806c;
  --accent:#c7ec4a;
  --accent-strong:#dbfb5f;
  --accent-contrast:#141d05;
  --accent-soft:#25320f;
  --accent2:#33d3b7;
  --accent2-soft:#0f2c28;
  --danger:#ff8f80;
  --danger-soft:#3a1a15;
  --warning:#ffc36a;
  --warning-soft:#3a2c0f;
  --live:#ff8f80;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 6px 20px -8px rgba(0,0,0,.5);
  --shadow-lg:0 24px 56px -20px rgba(0,0,0,.65);
  color-scheme: dark;
}

/* ============================= RESET ============================= */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
html{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  scroll-padding-top:env(safe-area-inset-top,0px);
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100%;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;margin:0;color:var(--text);}
p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);}
a{color:inherit;}
ul{margin:0;padding:0;list-style:none;}
::selection{background:var(--accent-soft);}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:4px;}
button{cursor:pointer;}
button:disabled{cursor:not-allowed;}

/* ============================= LAYOUT SHELL ============================= */
#shell{
  display:grid;
  grid-template-columns:248px 1fr;
  min-height:100vh;
  min-height:100dvh;
}
#sidebar{
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:20px 14px;
  display:flex;
  flex-direction:column;
  gap:18px;
  position:sticky;
  top:0;
  height:100dvh;
  overflow-y:auto;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:4px 8px 10px 8px;
}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent-contrast);
  flex-shrink:0;
}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1;}
.brand-sub{font-size:11px;color:var(--text-faint);letter-spacing:.02em;margin-top:2px;}

.nav-section-label{
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-faint);padding:0 10px;margin-top:4px;font-weight:600;
}
.nav-list{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:10px;
  color:var(--text-dim);font-size:14px;font-weight:500;
  background:transparent;border:none;text-align:left;width:100%;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.nav-item svg{flex-shrink:0;width:17px;height:17px;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.is-active{background:var(--accent-soft);color:var(--accent-strong);font-weight:600;}
.tourn-list{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto;}
.tourn-item{
  display:flex;flex-direction:column;gap:2px;
  padding:8px 10px;border-radius:10px;border:none;background:transparent;text-align:left;width:100%;
  color:var(--text-dim);
}
.tourn-item:hover{background:var(--surface-2);}
.tourn-item.is-active{background:var(--surface-3);color:var(--text);}
.tourn-item .t-name{font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tourn-item .t-meta{font-size:11.5px;color:var(--text-faint);}

.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--border);}
.theme-toggle{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);
  font-size:13px;color:var(--text-dim);
}
.theme-toggle button{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);
}
.theme-toggle button svg{width:15px;height:15px;}
.theme-toggle button.is-on{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);}

#mobile-topbar{display:none;}

/* ============================= MAIN ============================= */
#main{min-width:0;display:flex;flex-direction:column;}
#content{flex:1;padding:28px 34px 60px;max-width:1180px;width:100%;margin:0 auto;}
@media (max-width:640px){#content{padding:18px 16px 90px;}}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-head h1{font-size:26px;}
.page-head .sub{color:var(--text-dim);font-size:14px;margin-top:4px;}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* ============================= BUTTONS ============================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:10px;border:1px solid transparent;
  font-size:13.5px;font-weight:600;line-height:1;white-space:nowrap;
  transition:background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease), transform .1s var(--ease);
  min-height:38px;
}
.btn svg{width:15px;height:15px;flex-shrink:0;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--accent);color:var(--accent-contrast);}
.btn-primary:hover{background:var(--accent-strong);}
.btn-secondary{background:var(--surface-2);color:var(--text);border-color:var(--border);}
.btn-secondary:hover{background:var(--surface-3);}
.btn-ghost{background:transparent;color:var(--text-dim);}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-danger:hover{filter:brightness(.95);}
.btn-outline{background:transparent;border-color:var(--border-strong);color:var(--text);}
.btn-outline:hover{background:var(--surface-2);}
.btn-sm{padding:6px 11px;min-height:30px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45;}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;color:var(--text-dim);flex-shrink:0;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.icon-btn:hover{background:var(--surface-2);color:var(--text);}
.icon-btn svg{width:16px;height:16px;}

/* ============================= CARDS / SURFACES ============================= */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;
}
.card-hover{transition:border-color .15s var(--ease), box-shadow .15s var(--ease), transform .1s var(--ease);cursor:pointer;}
.card-hover:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm);}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}

.tourn-card{display:flex;flex-direction:column;gap:12px;}
.tourn-card .thead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.tourn-card h3{font-size:17px;}
.tourn-card .sport-tag{
  font-size:11px;font-weight:600;color:var(--accent2);background:var(--accent2-soft);
  padding:3px 8px;border-radius:99px;white-space:nowrap;
}
.tourn-card .meta-row{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text-dim);}
.tourn-card .meta-row span{display:flex;align-items:center;gap:6px;}
.tourn-card .meta-row svg{width:14px;height:14px;color:var(--text-faint);flex-shrink:0;}
.tourn-card .foot{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--border);}

/* ============================= BADGES ============================= */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:99px;white-space:nowrap;line-height:1.4;
}
.badge-dot{width:6px;height:6px;border-radius:99px;background:currentColor;flex-shrink:0;}
.badge-neutral{background:var(--surface-3);color:var(--text-dim);}
.badge-accent{background:var(--accent-soft);color:var(--accent-strong);}
.badge-teal{background:var(--accent2-soft);color:var(--accent2);}
.badge-warn{background:var(--warning-soft);color:var(--warning);}
.badge-danger{background:var(--danger-soft);color:var(--danger);}
.badge-live{background:var(--danger-soft);color:var(--live);}
.badge-live .badge-dot{animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

/* ============================= EMPTY STATE ============================= */
.empty-state{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
  padding:60px 24px;border:1.5px dashed var(--border-strong);border-radius:var(--radius-lg);color:var(--text-dim);
}
.empty-state .es-icon{
  width:52px;height:52px;border-radius:14px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;color:var(--text-faint);margin-bottom:4px;
}
.empty-state .es-icon svg{width:24px;height:24px;}
.empty-state h3{font-size:16px;color:var(--text);}
.empty-state p{max-width:340px;font-size:13.5px;}
.empty-state .es-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center;}

/* ============================= TABS ============================= */
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;}
.tab-btn{
  padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--text-faint);
  border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
  transition:color .15s var(--ease), border-color .15s var(--ease);
}
.tab-btn svg{width:15px;height:15px;}
.tab-btn:hover{color:var(--text);}
.tab-btn.is-active{color:var(--accent-strong);border-color:var(--accent);}

.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  padding:6px 13px;border-radius:99px;border:1px solid var(--border);background:var(--surface);
  font-size:12.5px;font-weight:600;color:var(--text-dim);
}
.chip.is-active{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);}
.chip-add{border-style:dashed;color:var(--text-faint);}

/* ============================= FORMS ============================= */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12.5px;font-weight:600;color:var(--text-dim);}
.field .hint{font-size:11.5px;color:var(--text-faint);}
.field .error-msg{font-size:11.5px;color:var(--danger);font-weight:600;}
.input,select.input,textarea.input{
  width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--border-strong);
  background:var(--bg-elevated);color:var(--text);min-height:40px;
  transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent2-soft);outline:none;}
textarea.input{min-height:76px;resize:vertical;}
.input.is-invalid{border-color:var(--danger);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:520px){.form-row{grid-template-columns:1fr;}}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media (max-width:640px){.form-row-3{grid-template-columns:1fr;}}
.checkbox-row{display:flex;align-items:center;gap:9px;padding:9px 0;}
.checkbox-row input{width:17px;height:17px;accent-color:var(--accent-strong);}
.checkbox-row label{font-size:13.5px;color:var(--text);font-weight:500;}
fieldset{border:none;padding:0;margin:0;}
legend{font-family:var(--font-display);font-size:15px;font-weight:700;margin-bottom:12px;padding:0;}

/* ============================= WIZARD ============================= */
.wizard-steps{display:flex;align-items:center;gap:6px;margin-bottom:26px;flex-wrap:wrap;}
.wizard-step{display:flex;align-items:center;gap:8px;}
.wizard-step .num{
  width:26px;height:26px;border-radius:99px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;background:var(--surface-2);color:var(--text-faint);border:1px solid var(--border);
}
.wizard-step.is-active .num{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);}
.wizard-step.is-done .num{background:var(--accent-soft);color:var(--accent-strong);border-color:var(--accent-soft);}
.wizard-step .label{font-size:13px;font-weight:600;color:var(--text-faint);}
.wizard-step.is-active .label{color:var(--text);}
.wizard-step-sep{width:20px;height:1px;background:var(--border);}
.wizard-panel{max-width:640px;}
.wizard-actions{display:flex;justify-content:space-between;margin-top:26px;padding-top:18px;border-top:1px solid var(--border);}

.mini-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.mini-list-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);
}
.mini-list-item .name{font-size:13.5px;font-weight:600;}
.mini-list-item .meta{font-size:11.5px;color:var(--text-faint);}

/* ============================= TABLE ============================= */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}
table.data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
table.data-table th{
  text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--text-faint);border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;
}
table.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.data-table tr:last-child td{border-bottom:none;}
table.data-table tr.is-top{background:var(--accent-soft);}
.rank-num{font-family:var(--font-mono);font-weight:600;color:var(--text-faint);}
.team-cell{display:flex;flex-direction:column;}
.team-cell .p2{font-size:11px;color:var(--text-faint);}

/* ============================= BRACKET ============================= */
.bracket-scroll{overflow-x:auto;padding:8px 4px 20px;}
.bracket{display:flex;gap:46px;align-items:flex-start;min-width:max-content;padding:4px;}
.bracket-round{display:flex;flex-direction:column;gap:18px;min-width:210px;}
.bracket-round-title{
  font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;
  text-align:center;margin-bottom:2px;
}
.bracket-col{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:18px;position:relative;}
.match-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative;
  transition:border-color .15s var(--ease);
}
.match-card.is-clickable{cursor:pointer;}
.match-card.is-clickable:hover{border-color:var(--accent2);}
.match-card.is-tbd{opacity:.55;}
.match-slot{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 10px;font-size:12.5px;font-weight:600;
}
.match-slot + .match-slot{border-top:1px solid var(--border);}
.match-slot.is-winner{background:var(--accent-soft);color:var(--accent-strong);}
.match-slot .seed{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);font-weight:600;margin-right:6px;}
.match-slot .score{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);flex-shrink:0;}
.match-slot.is-winner .score{color:var(--accent-strong);}
.match-meta{padding:5px 10px;font-size:10.5px;color:var(--text-faint);border-top:1px solid var(--border);background:var(--surface-2);display:flex;justify-content:space-between;gap:6px;}
.bracket-connector{position:absolute;right:-24px;top:0;bottom:0;width:24px;pointer-events:none;}

.champion-banner{
  display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:var(--radius-lg);
  background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1px solid var(--accent);
  margin-bottom:20px;
}
.champion-banner .cup{
  width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-contrast);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.champion-banner .cup svg{width:24px;height:24px;}
.champion-banner .ctitle{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);font-weight:700;}
.champion-banner .cname{font-family:var(--font-display);font-size:19px;font-weight:700;}

/* ============================= GROUPS ============================= */
.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;}
.group-card h4{font-size:14.5px;margin-bottom:10px;}
.group-matches{display:flex;flex-direction:column;gap:7px;margin-top:12px;}
.gm-row{
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;
  border:1px solid var(--border);border-radius:9px;font-size:12.5px;background:var(--surface-2);
  cursor:pointer;transition:border-color .15s var(--ease);
}
.gm-row:hover{border-color:var(--accent2);}
.gm-row .gm-teams{display:flex;flex-direction:column;gap:2px;}
.gm-row .gm-teams .win{font-weight:700;color:var(--accent-strong);}
.gm-row .gm-score{font-family:var(--font-mono);color:var(--text-dim);font-size:12px;white-space:nowrap;}

/* ============================= SCHEDULE ============================= */
.schedule-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:18px;padding:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);}
.schedule-toolbar .field{margin-bottom:0;min-width:120px;flex:1;}
.court-columns{display:grid;gap:14px;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);overflow-x:auto;padding-bottom:8px;}
.court-col-head{
  font-size:12.5px;font-weight:700;padding:8px 10px;background:var(--surface-3);border-radius:9px 9px 0 0;
  display:flex;align-items:center;justify-content:space-between;
}
.court-col-body{border:1px solid var(--border);border-top:none;border-radius:0 0 9px 9px;min-height:120px;padding:8px;display:flex;flex-direction:column;gap:8px;}
.sched-card{
  border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:12px;background:var(--surface);cursor:pointer;
  transition:border-color .15s var(--ease);
}
.sched-card:hover{border-color:var(--accent2);}
.sched-card .time{font-family:var(--font-mono);font-weight:700;color:var(--accent2);font-size:12px;}
.sched-card .teams{margin-top:3px;font-weight:600;}
.sched-card .cat{color:var(--text-faint);font-size:10.5px;margin-top:2px;}
.unscheduled-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.unsched-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px dashed var(--border-strong);border-radius:9px;font-size:12.5px;}

/* ============================= MODAL ============================= */
#modal-root{position:fixed;inset:0;z-index:60;pointer-events:none;}
.modal-overlay{
  position:absolute;inset:0;background:rgba(10,12,6,.5);backdrop-filter:blur(2px);
  opacity:0;transition:opacity .18s var(--ease);pointer-events:auto;
}
.modal-overlay.is-open{opacity:1;}
.modal-box{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-46%);
  width:min(520px,92vw);max-height:86dvh;overflow-y:auto;
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);pointer-events:auto;
  opacity:0;transition:opacity .18s var(--ease), transform .18s var(--ease);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.modal-box.is-open{opacity:1;transform:translate(-50%,-50%);}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 6px;}
.modal-head h3{font-size:18px;}
.modal-head p{font-size:12.5px;color:var(--text-dim);margin-top:4px;}
.modal-body{padding:14px 22px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 20px;border-top:1px solid var(--border);margin-top:4px;}

/* ============================= TOAST ============================= */
#toast-root{position:fixed;bottom:18px;right:18px;z-index:80;display:flex;flex-direction:column;gap:8px;padding-bottom:env(safe-area-inset-bottom,0px);max-width:min(340px,90vw);}
@media (max-width:640px){#toast-root{left:14px;right:14px;bottom:14px;max-width:none;}}
.toast{
  display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:11px;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-md);font-size:13px;
  animation:toast-in .2s var(--ease);
}
@keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.toast .ic{width:18px;height:18px;flex-shrink:0;margin-top:1px;}
.toast.t-success .ic{color:var(--accent2);}
.toast.t-error .ic{color:var(--danger);}
.toast.t-info .ic{color:var(--text-dim);}
.toast button{background:none;border:none;color:var(--text-faint);flex-shrink:0;padding:0;}

/* ============================= MISC ============================= */
.section-title{font-size:14px;font-weight:700;margin-bottom:12px;font-family:var(--font-display);}
.divider{height:1px;background:var(--border);margin:20px 0;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media (max-width:760px){.two-col{grid-template-columns:1fr;}}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.stat-box .num{font-family:var(--font-display);font-size:26px;font-weight:700;}
.stat-box .lbl{font-size:12px;color:var(--text-dim);margin-top:2px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;}
.note-box{
  display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--accent2-soft);
  border:1px solid var(--accent2);font-size:12.5px;color:var(--text);
}
.note-box svg{width:16px;height:16px;color:var(--accent2);flex-shrink:0;margin-top:1px;}
.help-text{font-size:12.5px;color:var(--text-faint);margin-bottom:16px;}
.confirm-warning{background:var(--danger-soft);border:1px solid var(--danger);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--text);margin-bottom:14px;display:flex;gap:9px;}
.confirm-warning svg{width:16px;height:16px;color:var(--danger);flex-shrink:0;margin-top:1px;}

/* ============================= MOBILE NAV ============================= */
@media (max-width:900px){
  #shell{grid-template-columns:1fr;}
  #sidebar{
    position:fixed;left:0;top:0;bottom:0;width:250px;z-index:70;
    transform:translateX(-104%);transition:transform .2s var(--ease);
    box-shadow:var(--shadow-lg);
  }
  #sidebar.is-open{transform:translateX(0);}
  #sidebar-scrim{
    position:fixed;inset:0;background:rgba(10,12,6,.45);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s var(--ease);
  }
  #sidebar-scrim.is-open{opacity:1;pointer-events:auto;}
  #mobile-topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));
    background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;
  }
  #mobile-topbar .brand{padding:0;}
  #mobile-topbar .brand-name{font-size:16px;}
  #mobile-topbar .brand-mark{width:28px;height:28px;}
}
@media (min-width:901px){#sidebar-scrim{display:none;}}

.skeleton-line{height:12px;background:var(--surface-3);border-radius:6px;}
</style>
</head>
<body>
<div id="shell">
  <div id="sidebar-scrim"></div>

  <div id="main">
    <div id="mobile-topbar"></div>

<div id="modal-root"></div>

<script>
/* =========================================================================
   CANCHA — Gestión de Torneos
   ========================================================================= */

/* ---------------------------- ICONOS (SVG) ---------------------------- */
const ICONS = {

  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>',

  chevronRight:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  chevronLeft:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  checkCircle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',

  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
  zap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h8l-1 8 10-12h-8l1-8Z"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4a1 1 0 0 1 1-1c2 0 3 1 6 1s4-1 6-1a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1c-2 0-3-1-6-1s-4 1-6 1"/></svg>',
  arrowRight:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',

};
function icon(name){ return ICONS[name] || ''; }

/* ---------------------------- UTILIDADES ---------------------------- */
function uid(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function nextPow2(n){ let p=1; while(p<n) p*=2; return p; }
function fmtMinutes(mins){
  const h = Math.floor(mins/60).toString().padStart(2,'0');
  const m = (mins%60).toString().padStart(2,'0');
  return h+':'+m;
}
function parseTimeToMinutes(t){
  if(!t) return 0;
  const [h,m] = t.split(':').map(Number);
  return h*60+(m||0);
}
function fmtDate(iso){
  if(!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  if(isNaN(dt.getTime())) return iso;
  return dt.toLocaleDateString('es-AR', {day:'2-digit', month:'short', year:'numeric'});
}
function todayIso(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* Formato y validación precisa de franjas horarias */
function formatSlotLabel(dateStr, startStr, endStr){
  if(!dateStr) return `${startStr} a ${endStr} hs`;
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const weekday = dt.toLocaleDateString('es-AR', { weekday: 'long' });
  const capWeekday = weekday.charAt(0).toUpperCase() + weekday.slice(1);
  const formattedDate = dt.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  return `${capWeekday} ${formattedDate} (${startStr} a ${endStr} hs)`;
}

function checkSlotOverlap(date, start, end, existingSlots, excludeId = null){
  const startM = parseTimeToMinutes(start);
  const endM = parseTimeToMinutes(end);
  if(endM <= startM){
    return { error: 'La hora de fin debe ser posterior a la hora de inicio.' };
  }
  for(const s of existingSlots){
    if(excludeId && s.id === excludeId) continue;
    if(s.date === date){
      const sStart = parseTimeToMinutes(s.startTime);
      const sEnd = parseTimeToMinutes(s.endTime);
      // Intervalos [startM, endM) y [sStart, sEnd) se superponen si:
      if(Math.max(startM, sStart) < Math.min(endM, sEnd)){
        return {
          error: `Se superpone con una franja existente el mismo día (${s.startTime} a ${s.endTime} hs).`
        };
      }
    }
  }
  return { ok: true };
}

function sortTimeSlots(slots){
  return slots.sort((a,b)=>{
    if(a.date !== b.date) return a.date.localeCompare(b.date);
    return parseTimeToMinutes(a.startTime) - parseTimeToMinutes(b.startTime);
  });
}

function seedOrder(size){
  let order = [1,2];
  while(order.length < size){
    const s = order.length*2;
    const next = [];
    for(const seed of order){ next.push(seed); next.push(s+1-seed); }
    order = next;
  }
  return order;
}

/* ---------------------------- ESTADO ---------------------------- */
const STORAGE_KEY = 'cancha_torneos_app_v1';

const state = {
  theme: 'light',
  tournaments: [],
  activeTournamentId: null,
  activeCategoryId: null,
  view: 'dashboard',
  wizard: null,
  sidebarOpen: false,
};

let storageSaveFailed = false;

function saveState(){
  try{
    const data = { theme: state.theme, tournaments: state.tournaments };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    storageSaveFailed = false;
  }catch(e){
    console.error('No se pudo guardar el estado de los torneos en el almacenamiento local.', e);
    if(!storageSaveFailed){
      showToast('No se pudieron guardar los cambios en este navegador. Exportá o copiá los datos antes de cerrar la página.', 'error');
      storageSaveFailed = true;
    }
  }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(data && Array.isArray(data.tournaments)){
      state.tournaments = data.tournaments;
      if(data.theme) state.theme = data.theme;
      return true;
    }
  }catch(e){ }
  return false;
}

/* ---------------------------- MODELOS ---------------------------- */
const SPORTS = [
  {key:'PADEL', label:'Pádel', scoringMode:'SETS', playersPerSide:2},
  {key:'TENIS', label:'Tenis', scoringMode:'SETS', playersPerSide:1},
  {key:'PICKLEBALL', label:'Pickleball', scoringMode:'SETS', playersPerSide:2},
  {key:'FUTBOL5', label:'Fútbol 5', scoringMode:'SCORE', playersPerSide:5},
];
function sportInfo(key){ return SPORTS.find(s=>s.key===key) || SPORTS[0]; }

const FORMATS = [
  {key:'ELIMINATION', label:'Eliminación directa', needsGroups:false},
  {key:'GROUPS_PLAYOFFS', label:'Fase de grupos + playoffs', needsGroups:true},
  {key:'ROUND_ROBIN', label:'Todos contra todos', needsGroups:true, noPlayoffs:true},
];
function formatInfo(key){ return FORMATS.find(f=>f.key===key) || FORMATS[0]; }

function createTournament(data){
  const baseDate = data.date || todayIso();
  const defaultSlots = [
    { id: uid('slot'), date: baseDate, startTime: '09:00', endTime: '12:00', label: formatSlotLabel(baseDate, '09:00', '12:00') },
    { id: uid('slot'), date: baseDate, startTime: '15:00', endTime: '18:00', label: formatSlotLabel(baseDate, '15:00', '18:00') }
  ];

  return {
    id: uid('tor'),
    name: data.name,
    description: data.description||'',
    venue: data.venue||'',
    date: baseDate,
    courts: data.courts && data.courts.length ? data.courts : [{id:uid('c'),name:'Cancha 1'},{id:uid('c'),name:'Cancha 2'}],
    timeSlots: data.timeSlots ? sortTimeSlots(data.timeSlots) : defaultSlots,
    startTime: data.startTime || '09:00',
    endTime: data.endTime || '22:00',
    matchDuration: data.matchDuration || 90,
    restTime: data.restTime || 45,
    paymentMethod: data.paymentMethod || 'MANUAL',
    manualStatus: null,
    createdAt: Date.now(),
    categories: [],
  };
}
function createCategory(data){
  const sport = sportInfo(data.sport);
  return {
    id: uid('cat'),
    tournamentId: data.tournamentId,
    name: data.name,
    sport: data.sport,
    format: data.format,
    maxTeams: data.maxTeams,
    entryFee: data.entryFee || 0,
    qualifiersPerGroup: data.qualifiersPerGroup || 2,
    groupSize: data.groupSize || 4,
    scoringMode: sport.scoringMode,
    setsToWin: data.setsToWin || 2,
    superTiebreak: data.superTiebreak !== undefined ? data.superTiebreak : true,
    winPoints: sport.scoringMode==='SCORE' ? 3 : 2,
    drawPoints: sport.scoringMode==='SCORE' ? 1 : 0,
    status: 'REGISTRATION',
    teams: [],
    waitlist: [],
    groups: [],
    matches: [],
    playoffGenerated: false,
    createdAt: Date.now(),
  };
}
function createTeam(data){
  return {
    id: uid('team'),
    name: data.name,
    player1: data.player1||'',
    player2: data.player2||'',
    seed: data.seed || null,
    availableSlots: data.availableSlots || [],
    registeredAt: Date.now(),
  };
}
function createMatch(data){
  return {
    id: uid('m'),
    categoryId: data.categoryId,
    stage: data.stage,
    groupId: data.groupId || null,
    round: data.round ?? null,
    slot: data.slot ?? null,
    label: data.label || '',
    team1Id: data.team1Id || null,
    team2Id: data.team2Id || null,
    team1Source: data.team1Source || null,
    team2Source: data.team2Source || null,
    nextMatchId: null,
    nextSlot: null,
    court: null,
    scheduledDate: null,
    scheduledStart: null,
    scheduledEnd: null,
    status: 'PENDING',
    sets: [],
    score: null,
    winnerId: null,
    createdAt: Date.now(),
  };
}

/* ---------------------------- HELPERS DE DATOS ---------------------------- */
function getTournament(id){ return state.tournaments.find(t=>t.id===id); }
function getCategory(tournament, catId){ return tournament ? tournament.categories.find(c=>c.id===catId) : null; }
function getTeam(category, teamId){ return category ? category.teams.find(t=>t.id===teamId) : null; }
function getMatch(category, matchId){ return category ? category.matches.find(m=>m.id===matchId) : null; }
function activeTournament(){ return getTournament(state.activeTournamentId); }
function activeCategory(){ const t=activeTournament(); return t ? getCategory(t, state.activeCategoryId) : null; }

function tournamentComputedStatus(t){
  if(t.manualStatus==='CANCELLED') return {key:'CANCELLED', label:'Cancelado', tone:'danger'};
  if(t.categories.length===0) return {key:'DRAFT', label:'Borrador', tone:'neutral'};
  const statuses = t.categories.map(c=>c.status);
  if(statuses.every(s=>s==='FINISHED')) return {key:'FINISHED', label:'Finalizado', tone:'neutral'};
  if(statuses.some(s=>s==='REGISTRATION')) return {key:'OPEN', label:'Inscripciones abiertas', tone:'accent'};
  return {key:'IN_PROGRESS', label:'En curso', tone:'teal'};
}
function categoryStatusInfo(c){
  const map = {
    REGISTRATION: {label:'Inscripciones abiertas', tone:'accent'},
    GENERATED: {label:'Cuadro / zonas generadas', tone:'teal'},
    GROUPS_DONE: {label:'Zonas finalizadas', tone:'teal'},
    FINISHED: {label:'Finalizada', tone:'neutral'},
  };
  return map[c.status] || {label:c.status, tone:'neutral'};
}

/* ---------------------------- MOTOR: CUADRO DE ELIMINACIÓN ---------------------------- */
function buildEliminationBracket(category, entrants){
  const n = entrants.length;
  const size = nextPow2(n);
  const order = seedOrder(size);
  const slots = order.map(seedNum=>{
    const e = entrants.find(x=>x.seed===seedNum);
    return e ? e.teamId : null;
  });

  const matches = [];
  const numRounds = Math.log2(size);
  let prevRoundMatches = [];

  for(let r=0; r<numRounds; r++){
    const matchesInRound = size / Math.pow(2, r+1);
    const roundMatches = [];
    for(let i=0;i<matchesInRound;i++){
      const m = createMatch({
        categoryId: category.id,
        stage:'BRACKET',
        round: r,
        slot: i,
        label: roundLabel(r, numRounds),
      });
      if(r===0){
        m.team1Id = slots[i*2];
        m.team2Id = slots[i*2+1];
      }
      matches.push(m);
      roundMatches.push(m);
    }
    if(r>0){
      prevRoundMatches.forEach((pm, idx)=>{
        const nm = roundMatches[Math.floor(idx/2)];
        pm.nextMatchId = nm.id;
        pm.nextSlot = idx%2===0 ? 1 : 2;
        const side = idx%2===0 ? 'team1Source' : 'team2Source';
        nm[side] = 'Ganador ' + (pm.label);
      });
    }
    prevRoundMatches = roundMatches;
  }

  let changed = true;
  let guard = 0;
  while(changed && guard < 50){
    changed = false; guard++;
    for(const m of matches){
      if(m.round===0 && m.status==='PENDING'){
        const hasT1 = !!m.team1Id, hasT2 = !!m.team2Id;
        if(hasT1 !== hasT2){
          const winner = hasT1 ? m.team1Id : m.team2Id;
          m.winnerId = winner;
          m.status = 'BYE';
          propagateWinner(matches, m, winner);
          changed = true;
        } else if(!hasT1 && !hasT2){
          m.status = 'BYE';
        }
      }
    }
  }
  return matches;
}
function roundLabel(r, totalRounds){
  const fromEnd = totalRounds - r;
  if(fromEnd===1) return 'Final';
  if(fromEnd===2) return 'Semifinal';
  if(fromEnd===3) return 'Cuartos de final';
  if(fromEnd===4) return 'Octavos de final';
  return 'Ronda ' + (r+1);
}
function propagateWinner(matches, match, winnerId){
  if(!match.nextMatchId) return;
  const next = matches.find(m=>m.id===match.nextMatchId);
  if(!next) return;
  if(match.nextSlot===1) next.team1Id = winnerId; else next.team2Id = winnerId;
}

/* ---------------------------- MOTOR: ZONAS (ROUND ROBIN) ---------------------------- */
function buildGroups(category, entrants){
  const groupSize = category.groupSize || 4;
  const numGroups = Math.max(1, Math.ceil(entrants.length / groupSize));
  const groups = [];
  for(let i=0;i<numGroups;i++){
    groups.push({ id: uid('grp'), name: 'Zona ' + String.fromCharCode(65+i), teamIds: [] });
  }
  let dir = 1, g = 0;
  entrants.forEach(e=>{
    groups[g].teamIds.push(e.teamId);
    g += dir;
    if(g===numGroups){ g=numGroups-1; dir=-1; }
    else if(g<0){ g=0; dir=1; }
  });
  return groups;
}
function buildGroupMatches(category, groups){
  const matches = [];
  groups.forEach(group=>{
    const ids = group.teamIds;
    for(let i=0;i<ids.length;i++){
      for(let j=i+1;j<ids.length;j++){
        matches.push(createMatch({
          categoryId: category.id,
          stage:'GROUP',
          groupId: group.id,
          team1Id: ids[i],
          team2Id: ids[j],
          label: group.name,
        }));
      }
    }
  });
  return matches;
}

/* ---------------------------- GENERAR FORMATO ---------------------------- */
function generateCategoryStructure(tournament, category){
  const entrants = category.teams
    .slice()
    .sort((a,b)=> (a.seed||9999) - (b.seed||9999) || a.registeredAt - b.registeredAt)
    .map((t,idx)=>({ teamId: t.id, seed: t.seed || (idx+1) }));

  entrants.forEach((e,idx)=>{ e.seed = idx+1; });

  const fmt = formatInfo(category.format);
  category.matches = [];
  category.groups = [];

  if(fmt.key==='ELIMINATION'){
    category.matches = buildEliminationBracket(category, entrants);
    category.status = 'GENERATED';
  } else {
    category.groups = buildGroups(category, entrants);
    category.matches = buildGroupMatches(category, category.groups);
    category.status = 'GENERATED';
  }
  category.playoffGenerated = false;
}

function allGroupMatchesFinished(category){
  const groupMatches = category.matches.filter(m=>m.stage==='GROUP');
  return groupMatches.length>0 && groupMatches.every(m=> ['FINISHED','WALKOVER'].includes(m.status));
}

function generatePlayoffsFromGroups(category){
  const standingsByGroup = category.groups.map(g=>({ group:g, rows: computeStandings(category, g) }));
  const qualifiers = [];
  const per = category.qualifiersPerGroup;
  for(let rank=0; rank<per; rank++){
    standingsByGroup.forEach(sg=>{
      if(sg.rows[rank]){
        qualifiers.push({ teamId: sg.rows[rank].teamId, tag: (rank+1)+'°' + ' ' + sg.group.name });
      }
    });
  }
  const entrants = qualifiers.map((q,idx)=>({ teamId:q.teamId, seed: idx+1, tag:q.tag }));
  const bracketMatches = buildEliminationBracket(category, entrants);
  bracketMatches.filter(m=>m.round===0).forEach(m=>{
    const e1 = entrants.find(e=> e.teamId===m.team1Id);
    const e2 = entrants.find(e=> e.teamId===m.team2Id);
    if(e1) m.team1Source = e1.tag;
    if(e2) m.team2Source = e2.tag;
  });
  category.matches = category.matches.concat(bracketMatches);
  category.playoffGenerated = true;
  category.status = 'GROUPS_DONE';
}

/* ---------------------------- STANDINGS / DESEMPATE ---------------------------- */
function computeStandings(category, group){
  const rows = group.teamIds.map(teamId=>({
    teamId, pj:0, pg:0, pp:0, pe:0, favor:0, contra:0, points:0,
  }));
  const byId = Object.fromEntries(rows.map(r=>[r.teamId, r]));
  const groupMatches = category.matches.filter(m=>m.groupId===group.id && ['FINISHED','WALKOVER'].includes(m.status));

  groupMatches.forEach(m=>{
    const r1 = byId[m.team1Id], r2 = byId[m.team2Id];
    if(!r1||!r2) return;
    r1.pj++; r2.pj++;
    if(category.scoringMode==='SETS'){
      const {setsA, setsB, gamesA, gamesB} = summarizeSets(m.sets);
      r1.favor += setsA; r1.contra += setsB;
      r2.favor += setsB; r2.contra += setsA;
      r1.gFavor = (r1.gFavor||0) + gamesA; r1.gContra = (r1.gContra||0) + gamesB;
      r2.gFavor = (r2.gFavor||0) + gamesB; r2.gContra = (r2.gContra||0) + gamesA;
    } else if(m.score){
      r1.favor += m.score.a; r1.contra += m.score.b;
      r2.favor += m.score.b; r2.contra += m.score.a;
    }
    if(m.winnerId===m.team1Id){ r1.pg++; r1.points+=category.winPoints; r2.pp++; }
    else if(m.winnerId===m.team2Id){ r2.pg++; r2.points+=category.winPoints; r1.pp++; }
    else { r1.pe++; r2.pe++; r1.points+=category.drawPoints; r2.points+=category.drawPoints; }
  });

  rows.forEach(r=>{ r.diff = r.favor - r.contra; r.gDiff = (r.gFavor||0)-(r.gContra||0); });

  rows.sort((a,b)=>{
    if(b.points !== a.points) return b.points - a.points;
    return 0;
  });

  let i=0;
  while(i<rows.length){
    let j=i;
    while(j<rows.length && rows[j].points===rows[i].points) j++;
    const block = rows.slice(i,j);
    if(block.length===2){
      const [a,b] = block;
      const h2h = groupMatches.find(m=> (m.team1Id===a.teamId && m.team2Id===b.teamId) || (m.team1Id===b.teamId && m.team2Id===a.teamId));
      if(h2h && h2h.winnerId){
        block.sort((x,y)=> x.teamId===h2h.winnerId ? -1 : (y.teamId===h2h.winnerId?1:0));
      } else {
        block.sort((x,y)=> (y.diff-x.diff) || ((y.gDiff||0)-(x.gDiff||0)));
      }
    } else if(block.length>2){
      block.sort((x,y)=> (y.diff-x.diff) || ((y.gDiff||0)-(x.gDiff||0)));
    }
    for(let k=0;k<block.length;k++) rows[i+k] = block[k];
    i=j;
  }
  return rows;
}
function summarizeSets(sets){
  let setsA=0, setsB=0, gamesA=0, gamesB=0;
  (sets||[]).forEach(s=>{
    gamesA += s.t1; gamesB += s.t2;
    if(s.t1>s.t2) setsA++; else if(s.t2>s.t1) setsB++;
  });
  return {setsA, setsB, gamesA, gamesB};
}

/* ---------------------------- VALIDACIÓN DE RESULTADOS ---------------------------- */
function isValidSet(a,b,isSuper){
  if(a===''||b===''||a===null||b===null||isNaN(a)||isNaN(b)) return false;
  a=Number(a); b=Number(b);
  if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0) return false;
  if(isSuper){
    const hi=Math.max(a,b), lo=Math.min(a,b);
    return hi>=10 && (hi-lo)>=2;
  }
  const hi=Math.max(a,b), lo=Math.min(a,b);
  if(hi===7 && (lo===5 || lo===6)) return true;
  if(hi>=6 && (hi-lo)>=2 && hi<=6) return true;
  return false;
}

/* ---------------------------- SCHEDULER HEURÍSTICO ---------------------------- */
function generateSchedule(tournament){
  const dailyStart = parseTimeToMinutes(tournament.startTime);
  const dailyEnd = parseTimeToMinutes(tournament.endTime);
  const duration = tournament.matchDuration;
  const rest = tournament.restTime;
  const courts = tournament.courts;
  const slots = (tournament.timeSlots && tournament.timeSlots.length
    ? tournament.timeSlots
    : [{id:null, date:tournament.date, startTime:tournament.startTime, endTime:tournament.endTime}])
    .slice()
    .sort((a,b)=>a.date.localeCompare(b.date) || parseTimeToMinutes(a.startTime)-parseTimeToMinutes(b.startTime))
    .map(slot=>{
      const start = Math.max(parseTimeToMinutes(slot.startTime), dailyStart);
      const end = Math.min(parseTimeToMinutes(slot.endTime), dailyEnd);
      const day = Date.parse(slot.date+'T00:00:00');
      return {
        id:slot.id,
        date:slot.date,
        start:day/60000+start,
        end:day/60000+end,
      };
    })
    .filter(slot=>slot.end>slot.start);

  const courtFree = {};
  const teamFree = {};

  tournament.categories.forEach(cat=>{
    cat.matches.forEach(m=>{
      if(['SCHEDULED','LIVE','FINISHED','WALKOVER'].includes(m.status) && m.court && Number.isFinite(m.scheduledStart) && Number.isFinite(m.scheduledEnd)){
        const matchDate = m.scheduledDate || tournament.date;
        const day = Date.parse(matchDate+'T00:00:00')/60000;
        const matchEnd = day + m.scheduledEnd;
        courtFree[m.court] = Math.max(courtFree[m.court] ?? -Infinity, matchEnd);
        [m.team1Id, m.team2Id].forEach(tid=>{
          if(tid) teamFree[tid] = Math.max(teamFree[tid] ?? -Infinity, matchEnd + rest);
        });
      }
    });
  });

  const pending = [];
  tournament.categories.forEach(cat=>{
    cat.matches.forEach(m=>{
      if(m.status==='PENDING' && m.team1Id && m.team2Id){
        pending.push({m, cat, priority: (m.stage==='GROUP'?0:1)*100 + (m.round||0)});
      }
    });
  });
  pending.sort((a,b)=> a.priority-b.priority || a.m.createdAt-b.m.createdAt);

  let scheduledCount = 0;
  const unschedulable = [];

  pending.forEach(({m,cat})=>{
    const t1 = getTeam(cat,m.team1Id), t2 = getTeam(cat,m.team2Id);
    const available1 = t1 && t1.availableSlots && t1.availableSlots.length ? t1.availableSlots : null;
    const available2 = t2 && t2.availableSlots && t2.availableSlots.length ? t2.availableSlots : null;
    const compatibleSlots = slots.filter(slot=>
      (!available1 || available1.includes(slot.id)) &&
      (!available2 || available2.includes(slot.id))
    );
    const teamsReady = Math.max(
      teamFree[m.team1Id] ?? -Infinity,
      teamFree[m.team2Id] ?? -Infinity
    );

    let bestCourt = null, bestSlot = null, bestStart = Infinity;
    compatibleSlots.forEach(slot=>{
      courts.forEach(c=>{
        const candidate = Math.max(slot.start, courtFree[c.id] ?? -Infinity, teamsReady);
        if(candidate + duration <= slot.end && candidate < bestStart){
          bestStart = candidate;
          bestCourt = c.id;
          bestSlot = slot;
        }
      });
    });

    if(bestCourt===null || !bestSlot){
      unschedulable.push(m);
      return;
    }
    m.court = bestCourt;
    m.scheduledDate = bestSlot.date;
    m.scheduledStart = bestStart - Date.parse(bestSlot.date+'T00:00:00')/60000;
    m.scheduledEnd = m.scheduledStart + duration;
    m.status = 'SCHEDULED';
    courtFree[bestCourt] = bestStart + duration;
    teamFree[m.team1Id] = bestStart + duration + rest;
    teamFree[m.team2Id] = bestStart + duration + rest;
    scheduledCount++;
  });

  return { scheduledCount, unscheduledCount: unschedulable.length };
}
function clearScheduleForPending(tournament){
  tournament.categories.forEach(cat=>{
    cat.matches.forEach(m=>{
      if(m.status==='SCHEDULED'){
        m.status='PENDING'; m.court=null; m.scheduledDate=null; m.scheduledStart=null; m.scheduledEnd=null;
      }
    });
  });
}

/* ---------------------------- TOASTS ---------------------------- */
function showToast(message, type){
  type = type || 'info';
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast t-' + type;
  const ic = type==='success' ? 'checkCircle' : type==='error' ? 'alert' : 'info';
  el.innerHTML = '<span class="ic">'+icon(ic)+'</span><span style="flex:1">'+escapeHtml(message)+'</span><button aria-label="Cerrar">'+icon('close')+'</button>';
  el.querySelector('button').addEventListener('click', ()=> el.remove());
  root.appendChild(el);
  setTimeout(()=>{ if(el.parentNode) el.remove(); }, 4200);
}

/* ---------------------------- MODAL SYSTEM ---------------------------- */
let modalCloseCallback = null;
function openModal({title, subtitle, bodyHtml, onMount, footHtml, onClose, wide}){
  const root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-overlay"></div>' +
    '<div class="modal-box" style="'+(wide?'width:min(680px,92vw);':'')+'">' +
      '<div class="modal-head">' +
        '<div><h3>'+escapeHtml(title)+'</h3>' + (subtitle?'<p>'+escapeHtml(subtitle)+'</p>':'') + '</div>' +
        '<button class="icon-btn" id="modal-close-x" aria-label="Cerrar">'+icon('close')+'</button>' +
      '</div>' +
      '<div class="modal-body" id="modal-body">'+(bodyHtml||'')+'</div>' +
      (footHtml? '<div class="modal-foot">'+footHtml+'</div>' : '') +
    '</div>';
  root.style.pointerEvents = 'auto';
  requestAnimationFrame(()=>{
    root.querySelector('.modal-overlay').classList.add('is-open');
    root.querySelector('.modal-box').classList.add('is-open');
  });
  modalCloseCallback = onClose || null;
  root.querySelector('.modal-overlay').addEventListener('click', closeModal);
  root.querySelector('#modal-close-x').addEventListener('click', closeModal);
  if(onMount) onMount(root);
}
function closeModal(){
  const root = document.getElementById('modal-root');
  const overlay = root.querySelector('.modal-overlay');
  const box = root.querySelector('.modal-box');
  if(overlay) overlay.classList.remove('is-open');
  if(box) box.classList.remove('is-open');
  root.style.pointerEvents = 'none';
  setTimeout(()=>{ root.innerHTML=''; }, 180);
  if(modalCloseCallback){ const cb=modalCloseCallback; modalCloseCallback=null; cb(); }
}
function confirmDialog({title, message, warn, confirmLabel, onConfirm, danger}){
  openModal({
    title,
    bodyHtml:
      (warn ? '<div class="confirm-warning">'+icon('alert')+'<span>'+escapeHtml(warn)+'</span></div>' : '') +
      '<p style="font-size:13.5px;color:var(--text-dim);">'+escapeHtml(message)+'</p>',
    footHtml:
      '<button class="btn btn-secondary" id="cf-cancel">Cancelar</button>' +
      '<button class="btn '+(danger?'btn-danger':'btn-primary')+'" id="cf-ok">'+escapeHtml(confirmLabel||'Confirmar')+'</button>',
    onMount:(root)=>{
      root.querySelector('#cf-cancel').addEventListener('click', closeModal);
      root.querySelector('#cf-ok').addEventListener('click', ()=>{ closeModal(); onConfirm(); });
    }
  });
}
